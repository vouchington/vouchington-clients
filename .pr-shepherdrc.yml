version: 1

checks:
  # checks.ignore entries must be the RAW name — either a Checks API check_run `name`
  # (e.g. 'Sourcery review') or a Statuses API commit status `context` — not the composite
  # display name shown in the PR UI.
  # pr-shepherd matches against the raw name; composite-name entries silently never match.
  ignore:
    - 'Sourcery review'

# v1 defaults drop both pre-v1 readiness holds. Pin them so a clean PR still
# waits ten minutes before terminal handoff, and a pending Copilot review
# still blocks draft-to-ready.
iterate:
  ready-delay-minutes: 10

mark-ready:
  blocking-reviewer-logins:
    - copilot

# pr-shepherd's bundled bot-noise classification rules.
classify:
  standard:
    all: true
