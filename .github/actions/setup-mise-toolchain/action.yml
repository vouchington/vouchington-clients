name: Set up a mise-managed native toolchain
description: Install the pinned .NET SDK or Swift compiler from the candidate client's mise configuration

inputs:
  client-root:
    description: Candidate client checkout path relative to GITHUB_WORKSPACE
    required: true
  tool:
    description: mise tool to install (dotnet or swift)
    required: true

runs:
  using: composite
  steps:
    - name: Install mise Swift runtime libraries
      if: runner.os == 'Linux' && inputs.tool == 'swift'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libncurses6
    - name: Install mise
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        cache: false
        install: false
    - name: Resolve pinned .NET SDK version
      id: dotnet-pin
      if: inputs.tool == 'dotnet'
      shell: bash
      env:
        CLIENT_ROOT: ${{ inputs.client-root }}
      run: |
        set -euo pipefail
        echo "version=$(jq -er '.sdk.version' "$GITHUB_WORKSPACE/$CLIENT_ROOT/global.json")" >> "$GITHUB_OUTPUT"
    - name: Restore mise-managed .NET SDK
      id: dotnet-sdk
      if: inputs.tool == 'dotnet'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/mise-data/installs/dotnet/${{ steps.dotnet-pin.outputs.version }}
        key: mise-dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-pin.outputs.version }}-${{ hashFiles(format('{0}/global.json', inputs.client-root)) }}
    - name: Seed .NET SDK from builds.dotnet.microsoft.com
      if: runner.os != 'Windows' && inputs.tool == 'dotnet' && steps.dotnet-sdk.outputs.cache-hit != 'true'
      shell: bash
      env:
        DOTNET_VERSION: ${{ steps.dotnet-pin.outputs.version }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        set -euo pipefail
        # mise's dotnet installer always fetches dot.net/v1/dotnet-install.sh, which is a single point of
        # failure. Pre-populate the exact install directory from the release CDN so mise finds it installed.
        case "$RUNNER_OS_NAME/$RUNNER_ARCH_NAME" in
          Linux/X64) rid=linux-x64 ;;
          Linux/ARM64) rid=linux-arm64 ;;
          macOS/X64) rid=osx-x64 ;;
          macOS/ARM64) rid=osx-arm64 ;;
          *) echo "unsupported runner: $RUNNER_OS_NAME/$RUNNER_ARCH_NAME" >&2; exit 2 ;;
        esac
        channel="$(echo "$DOTNET_VERSION" | cut -d. -f1,2)"
        curl_get() { curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 600 "$@"; }
        work="$(mktemp -d)"
        curl_get --output "$work/releases.json" "https://builds.dotnet.microsoft.com/dotnet/release-metadata/${channel}/releases.json"
        entry="$(jq -er --arg v "$DOTNET_VERSION" --arg rid "$rid" '[.releases[] | (.sdk, (.sdks // [])[]) | select(.version == $v) | .files[] | select(.rid == $rid and (.name | test("[.](tar[.]gz|zip)$")))][0] | "\(.url) \(.hash)"' "$work/releases.json")"
        url="${entry% *}"
        expected_hash="${entry##* }"
        [[ "$url" == "https://builds.dotnet.microsoft.com/dotnet/Sdk/$DOTNET_VERSION/"* && ${#expected_hash} -eq 128 ]]
        curl_get --output "$work/sdk.tar.gz" "$url"
        actual_hash="$(openssl dgst -sha512 -r "$work/sdk.tar.gz" | cut -d' ' -f1)"
        [[ "$actual_hash" == "$expected_hash" ]] || {
          echo "SHA-512 mismatch for $url: got $actual_hash, expected $expected_hash." >&2
          exit 1
        }
        install_dir="$RUNNER_TEMP/mise-data/installs/dotnet/$DOTNET_VERSION"
        mkdir -p -- "$work/extract" "$(dirname "$install_dir")"
        tar -xzf "$work/sdk.tar.gz" -C "$work/extract"
        [[ -x "$work/extract/dotnet" ]]
        rm -rf -- "$install_dir"
        mv -- "$work/extract" "$install_dir"
        rm -rf -- "$work"
    - name: Seed .NET SDK from builds.dotnet.microsoft.com on Windows
      if: runner.os == 'Windows' && inputs.tool == 'dotnet' && steps.dotnet-sdk.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        DOTNET_VERSION: ${{ steps.dotnet-pin.outputs.version }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        $ErrorActionPreference = 'Stop'
        # mise's dotnet installer always fetches dot.net/v1/dotnet-install.ps1, which is a single point of
        # failure. Pre-populate the exact install directory from the release CDN so mise finds it installed.
        $rid = switch ($env:RUNNER_ARCH_NAME) {
          'X64' { 'win-x64' }
          'ARM64' { 'win-arm64' }
          default { throw "unsupported runner architecture: $env:RUNNER_ARCH_NAME" }
        }
        $version = $env:DOTNET_VERSION
        $channel = ($version -split '\.')[0..1] -join '.'
        $work = Join-Path $env:RUNNER_TEMP "dotnet-seed-$([guid]::NewGuid())"
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        function Get-WithRetry($uri, $outFile) {
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $outFile -TimeoutSec 600
              return
            }
            catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds 5
            }
          }
        }
        $releasesPath = Join-Path $work 'releases.json'
        Get-WithRetry "https://builds.dotnet.microsoft.com/dotnet/release-metadata/$channel/releases.json" $releasesPath
        $releases = (Get-Content $releasesPath -Raw | ConvertFrom-Json).releases
        $file = $releases |
          ForEach-Object { $_.sdk; $_.sdks } |
          Where-Object { $_ -and $_.version -eq $version } |
          ForEach-Object { $_.files } |
          Where-Object { $_.rid -eq $rid -and $_.name -like '*.zip' } |
          Select-Object -First 1
        if (-not $file -or $file.url -notlike "https://builds.dotnet.microsoft.com/dotnet/Sdk/$version/*" -or $file.hash.Length -ne 128) {
          throw "No verifiable .NET SDK $version archive for $rid in release metadata."
        }
        $archive = Join-Path $work 'sdk.zip'
        Get-WithRetry $file.url $archive
        $actualHash = (Get-FileHash -Algorithm SHA512 -Path $archive).Hash
        if ($actualHash -ne $file.hash.ToUpperInvariant()) {
          throw "SHA-512 mismatch for $($file.url): got $actualHash, expected $($file.hash)."
        }
        $extract = Join-Path $work 'extract'
        Expand-Archive -Path $archive -DestinationPath $extract
        if (-not (Test-Path (Join-Path $extract 'dotnet.exe'))) {
          throw 'Extracted .NET SDK is missing dotnet.exe at its root.'
        }
        $installDir = Join-Path $env:RUNNER_TEMP "mise-data/installs/dotnet/$version"
        New-Item -ItemType Directory -Force -Path (Split-Path $installDir) | Out-Null
        if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
        Move-Item -Path $extract -Destination $installDir
        Remove-Item -Recurse -Force $work
    - name: Install candidate-pinned toolchain
      if: runner.os != 'Windows'
      shell: bash
      env:
        CLIENT_ROOT: ${{ inputs.client-root }}
        MISE_HTTP_TIMEOUT: 120s
        MISE_TOOL: ${{ inputs.tool }}
      run: |
        set -euo pipefail
        case "$MISE_TOOL" in
          dotnet)
            disabled_tools='actionlint,swift,shellcheck,github:boyter/scc,zizmor,aqua:gitleaks/gitleaks,aqua:lycheeverse/lychee,swiftformat'
            ;;
          swift)
            disabled_tools='actionlint,dotnet,shellcheck,github:boyter/scc,zizmor,aqua:gitleaks/gitleaks,aqua:lycheeverse/lychee,swiftformat'
            ;;
          *) echo "unsupported mise tool: $MISE_TOOL" >&2; exit 2 ;;
        esac
        export MISE_DISABLE_TOOLS="$disabled_tools"
        echo "MISE_DISABLE_TOOLS=$MISE_DISABLE_TOOLS" >> "$GITHUB_ENV"
        client_root="$GITHUB_WORKSPACE/$CLIENT_ROOT"
        [[ -f "$client_root/.mise.toml" && -f "$client_root/global.json" ]]
        mise_data_dir="$RUNNER_TEMP/mise-data"
        mise_cache_dir="$RUNNER_TEMP/mise-cache"
        mkdir -p -- "$mise_data_dir" "$mise_cache_dir"
        export MISE_DATA_DIR="$mise_data_dir" MISE_CACHE_DIR="$mise_cache_dir"
        {
          echo "MISE_DATA_DIR=$MISE_DATA_DIR"
          echo "MISE_CACHE_DIR=$MISE_CACHE_DIR"
        } >> "$GITHUB_ENV"
        cd "$client_root"
        mise trust "$client_root/.mise.toml"
        mise install "$MISE_TOOL"
        if [[ "$MISE_TOOL" == dotnet ]]; then
          expected="$(jq -er '.sdk.version' global.json)"
          actual="$(mise exec -- dotnet --version)"
          [[ "$actual" == "$expected" ]] || {
            echo "mise selected .NET SDK $actual; expected global.json $expected." >&2
            exit 1
          }
          dotnet_root="$(mise where dotnet)"
          [[ -x "$dotnet_root/dotnet" ]]
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
        else
          expected="$(mise ls --current --json | jq -er '.swift[0] | select(.active == true) | .version')"
          actual="$(mise exec -- swift --version | sed -n -E '1s/^(Apple )?Swift version ([^ (]+).*/\2/p')"
          expected_minor="${expected%.0}"
          [[ "$actual" == "$expected" || "$actual" == "$expected_minor" ]] || {
            echo "mise selected Swift $actual; expected $expected from .mise.toml." >&2
            exit 1
          }
          swift_root="$(mise where swift)"
          case "$swift_root" in
            "$MISE_DATA_DIR"/installs/swift/*) ;;
            *) echo "mise Swift installation is outside the job-scoped data directory: $swift_root" >&2; exit 1 ;;
          esac
        fi
    - name: Install candidate-pinned .NET SDK on Windows
      if: runner.os == 'Windows' && inputs.tool == 'dotnet'
      shell: pwsh
      env:
        CLIENT_ROOT: ${{ inputs.client-root }}
        MISE_HTTP_TIMEOUT: 120s
        MISE_TOOL: ${{ inputs.tool }}
      run: |
        $ErrorActionPreference = 'Stop'
        $disabledTools = 'actionlint,swift,shellcheck,github:boyter/scc,zizmor,aqua:gitleaks/gitleaks,aqua:lycheeverse/lychee,swiftformat'
        "MISE_DISABLE_TOOLS=$disabledTools" >> $env:GITHUB_ENV
        $env:MISE_DISABLE_TOOLS = $disabledTools
        $clientRoot = Join-Path $env:GITHUB_WORKSPACE $env:CLIENT_ROOT
        if (-not (Test-Path (Join-Path $clientRoot '.mise.toml')) -or
            -not (Test-Path (Join-Path $clientRoot 'global.json'))) {
          throw 'Candidate checkout is missing its mise or global.json toolchain pin.'
        }
        $env:MISE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mise-data'
        $env:MISE_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'mise-cache'
        New-Item -ItemType Directory -Force -Path $env:MISE_DATA_DIR, $env:MISE_CACHE_DIR | Out-Null
        "MISE_DATA_DIR=$env:MISE_DATA_DIR" >> $env:GITHUB_ENV
        "MISE_CACHE_DIR=$env:MISE_CACHE_DIR" >> $env:GITHUB_ENV
        Push-Location $clientRoot
        try {
          mise trust (Join-Path $clientRoot '.mise.toml')
          if ($LASTEXITCODE -ne 0) {
            throw "mise trust failed with exit code $LASTEXITCODE."
          }
          mise install $env:MISE_TOOL
          if ($LASTEXITCODE -ne 0) {
            throw "mise install failed with exit code $LASTEXITCODE."
          }
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $versionOutput = & mise exec -- dotnet --version
          if ($LASTEXITCODE -ne 0) {
            throw "mise exec -- dotnet --version failed with exit code $LASTEXITCODE."
          }
          $actual = ($versionOutput -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($actual)) {
            throw 'mise exec -- dotnet --version returned no SDK version.'
          }
          if ($actual -ne $expected) {
            throw "mise selected .NET SDK $actual; expected global.json $expected."
          }
          $dotnetRootOutput = & mise where dotnet
          if ($LASTEXITCODE -ne 0) {
            throw "mise where dotnet failed with exit code $LASTEXITCODE."
          }
          $dotnetRoot = ($dotnetRootOutput -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($dotnetRoot)) {
            throw 'mise where dotnet returned no installation path.'
          }
          if (-not (Test-Path (Join-Path $dotnetRoot 'dotnet.exe'))) {
            throw "mise .NET installation is missing dotnet.exe under $dotnetRoot."
          }
          "DOTNET_ROOT=$dotnetRoot" >> $env:GITHUB_ENV
          $dotnetRoot >> $env:GITHUB_PATH
        }
        finally {
          Pop-Location
        }
    - name: Save mise-managed .NET SDK from main
      if: inputs.tool == 'dotnet' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dotnet-sdk.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/mise-data/installs/dotnet/${{ steps.dotnet-pin.outputs.version }}
        key: ${{ steps.dotnet-sdk.outputs.cache-primary-key }}
