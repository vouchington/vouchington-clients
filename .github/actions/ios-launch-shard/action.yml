name: Launch one iOS Simulator smoke shard
description: Install the verified app on the booted Simulator and run one test-without-building shard against it

inputs:
  shard:
    description: Shard name, used for the result bundle path and the step summary
    required: true
  prefix:
    description: Runner temp file prefix written by the job's unpack step (ios-launch or ipad-launch)
    required: true
  only-testing:
    description: Space separated -only-testing arguments for this shard
    required: true
  expected-count:
    description: Exact number of passed tests the result summary must report
    required: true
  spawn-gate:
    description: Whether to reinstall and launch the app before xcodebuild (true or false)
    default: 'true'

runs:
  using: composite
  steps:
    - name: Launch shard on the booted Simulator
      shell: bash
      env:
        SHARD: ${{ inputs.shard }}
        PREFIX: ${{ inputs.prefix }}
        ONLY_TESTING: ${{ inputs.only-testing }}
        EXPECTED_COUNT: ${{ inputs.expected-count }}
        SPAWN_GATE: ${{ inputs.spawn-gate }}
      run: |
        bundle="$(cat "$RUNNER_TEMP/$PREFIX-test-products")"
        destination="$(cat "$RUNNER_TEMP/$PREFIX-destination")"
        simulator_id="$(cat "$RUNNER_TEMP/$PREFIX-simulator-id")"
        app="$(jq -r '.app' "$RUNNER_TEMP/ios-test-artifact/ios-test-manifest.json")"
        case "$app" in
          "$bundle"/*) ;;
          *) echo "::error::Refusing to install an app outside the unpacked test products" >&2; exit 1 ;;
        esac
        test -d "$app"
        if [[ "$SPAWN_GATE" == true ]]; then
          python3 "$GITHUB_WORKSPACE/scripts/ios-launch-spawn-gate.py" "$simulator_id" "$app"
        fi
        result="$RUNNER_TEMP/$PREFIX-$SHARD.xcresult"
        xcodebuild -testProductsPath "$bundle" -destination "$destination" -destination-timeout 120 -disableAutomaticPackageResolution -collect-test-diagnostics never -parallel-testing-enabled NO $ONLY_TESTING -resultBundlePath "$result" test-without-building VOUCHA_CONTRACT_ROOT="$VOUCHA_CONTRACT_ROOT" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
        xcrun xcresulttool get test-results summary --path "$result" | jq -e --argjson count "$EXPECTED_COUNT" '.totalTestCount == $count and .passedTests == $count and .failedTests == 0 and .skippedTests == 0'
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "### $PREFIX $SHARD"
            echo
            echo "Accepted $EXPECTED_COUNT passed test(s) and zero skipped tests."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
