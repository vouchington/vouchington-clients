name: Collect iOS Simulator launch diagnostics
description: Gather a short Simulator log and crash reports for one failed shard and upload them with its result bundle

inputs:
  shard:
    description: Failed shard name, part of the unique artifact name
    required: true
  prefix:
    description: Runner temp file prefix written by the job's unpack step (ios-launch or ipad-launch)
    required: true
  artifact-suffix:
    description: Matrix group name, part of the unique artifact name
    required: true

runs:
  using: composite
  steps:
    - name: Collect simulator log and crash reports
      shell: bash
      env:
        SHARD: ${{ inputs.shard }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        diagnostics="$RUNNER_TEMP/$PREFIX-$SHARD-diagnostics"
        mkdir -p "$diagnostics"
        xcrun simctl list devices available -j > "$diagnostics/simulators.json" || true
        if [ -f "$RUNNER_TEMP/$PREFIX-simulator-id" ]; then
          simulator_id="$(cat "$RUNNER_TEMP/$PREFIX-simulator-id")"
          xcrun simctl spawn "$simulator_id" log show --last 5m --style compact --predicate 'process == "Voucha" OR (process == "SpringBoard" AND eventMessage CONTAINS[c] "ai.voucha.ios")' > "$diagnostics/launch.log" 2>&1 || true
        fi
        reports_dir="$HOME/Library/Logs/DiagnosticReports"
        if [ -d "$reports_dir" ]; then
          find "$reports_dir" -maxdepth 1 \( -name 'Voucha*.ips' -o -name 'Voucha*.crash' \) -mmin -15 -exec cp {} "$diagnostics"/ \; || true
        fi
    - name: Upload shard diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
      with:
        name: ${{ inputs.prefix }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.artifact-suffix }}-${{ inputs.shard }}
        path: |
          ${{ runner.temp }}/${{ inputs.prefix }}-${{ inputs.shard }}.xcresult
          ${{ runner.temp }}/${{ inputs.prefix }}-${{ inputs.shard }}-diagnostics
        retention-days: 7
        if-no-files-found: warn
