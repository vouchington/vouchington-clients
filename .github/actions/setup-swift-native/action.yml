name: Set up Swift native quality tools
description: Install the pinned Swift quality tool set used by native contract consumers

inputs:
  tools:
    description: Either lint or periphery
    required: true

runs:
  using: composite
  steps:
    - name: Install mise
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        cache: false
        install: false
    - name: Install pinned Swift quality tools
      shell: bash
      env:
        TOOL_SET: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        mise trust "$GITHUB_WORKSPACE/.mise.toml"
        case "$TOOL_SET" in
          lint) mise install github:nicklockwood/SwiftFormat@0.61.1 aqua:realm/SwiftLint@0.65.0 ;;
          periphery) mise install aqua:peripheryapp/periphery@3.7.4 ;;
          *) echo "unsupported Swift quality tool set: $TOOL_SET" >&2; exit 2 ;;
        esac
