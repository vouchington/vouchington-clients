name: Set up Swift native quality tools
description: Install the pinned Swift quality tool set used by native contract consumers

inputs:
  tools:
    description: Either lint or periphery
    required: true

runs:
  using: composite
  steps:
    - name: Locate the mise binary directory
      id: mise-dir
      shell: bash
      run: |
        set -euo pipefail
        # Mirror mise-action's miseDir(): MISE_DATA_DIR, then XDG_DATA_HOME, then the platform default.
        if [[ -n "${MISE_DATA_DIR:-}" ]]; then data="$MISE_DATA_DIR"
        elif [[ -n "${XDG_DATA_HOME:-}" ]]; then data="$XDG_DATA_HOME/mise"
        elif [[ "$RUNNER_OS" == Windows ]]; then data="$LOCALAPPDATA/mise"
        else data="$HOME/.local/share/mise"
        fi
        echo "bin=$data/bin" >> "$GITHUB_OUTPUT"
    - name: Restore the mise binary
      id: mise-bin
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The binary, its version record, and the signed checksums mise-action verifies it against offline.
        path: |
          ${{ steps.mise-dir.outputs.bin }}/mise
          ${{ steps.mise-dir.outputs.bin }}/mise.exe
          ${{ steps.mise-dir.outputs.bin }}/mise-shim.exe
          ${{ steps.mise-dir.outputs.bin }}/mise-version
          ${{ steps.mise-dir.outputs.bin }}/SHASUMS256-*
        key: mise-bin-v1-${{ runner.os }}-${{ runner.arch }}-2026.11.12
    - name: Install mise
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: '2026.11.12'
        cache: false
        install: false
    - name: Save the mise binary from main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mise-bin.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.mise-dir.outputs.bin }}/mise
          ${{ steps.mise-dir.outputs.bin }}/mise.exe
          ${{ steps.mise-dir.outputs.bin }}/mise-shim.exe
          ${{ steps.mise-dir.outputs.bin }}/mise-version
          ${{ steps.mise-dir.outputs.bin }}/SHASUMS256-*
        key: ${{ steps.mise-bin.outputs.cache-primary-key }}
    - name: Install pinned Swift quality tools
      shell: bash
      env:
        TOOL_SET: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        mise trust "$GITHUB_WORKSPACE/.mise.toml"
        case "$TOOL_SET" in
          lint) mise install github:nicklockwood/SwiftFormat@0.61.1 aqua:realm/SwiftLint@0.65.0 ;;
          periphery) mise install aqua:peripheryapp/periphery@3.7.4 ;;
          *) echo "unsupported Swift quality tool set: $TOOL_SET" >&2; exit 2 ;;
        esac
