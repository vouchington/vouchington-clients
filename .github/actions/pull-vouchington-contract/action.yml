name: Pull Vouchington contract
description: Fetch the pinned Vouchington commit and write the generated native localization (not committed)

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      env:
        NPM_CONFIG_AUDIT: 'false'
      with:
        version: latest-12
    - name: Pull the pinned Vouchington contract
      shell: bash
      env:
        VOUCHA_CONTRACT_CACHE_DIR: ${{ runner.temp }}/vouchington-contract
      run: node scripts/contracts-pull.mjs
