name: Prepare verified native contract
description: Verify one producer artifact and check out its exact candidate revision

inputs:
  candidate-revision-sha:
    description: Verified pull request merge or main push revision
    required: true
  github-token:
    description: Read-only token used to download the producer artifact
    required: true
  producer-run-attempt:
    description: Producer workflow run attempt
    required: true
  producer-run-id:
    description: Producer workflow run ID
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
    - name: Clean persistent runner workspace
      shell: bash
      env:
        PRESERVE_NODE_MODULES: 'false'
      run: npx --yes pnpm@11.13.1 dlx vouchington-tooling@0.1.5 clean-workspace
    - name: Configure isolated native paths
      shell: bash
      run: |
        {
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/voucha-dotnet-sdk"
          echo "NUGET_HTTP_CACHE_PATH=$RUNNER_TEMP/voucha-dotnet-cache/http-cache"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/voucha-dotnet-cache/packages"
          echo "NUGET_PLUGINS_CACHE_PATH=$RUNNER_TEMP/voucha-dotnet-cache/plugins-cache"
          echo "NUGET_SCRATCH=$RUNNER_TEMP/voucha-dotnet-temp/nuget-scratch"
          echo "VOUCHA_DOTNET_CACHE_ROOT=$RUNNER_TEMP/voucha-dotnet-cache"
          echo "VOUCHA_DOTNET_TEMP_ROOT=$RUNNER_TEMP/voucha-dotnet-temp"
          echo "VOUCHA_FILAMENTS_CONTRACT_ROOT=$RUNNER_TEMP/native-contract"
        } >>"$GITHUB_ENV"
    - name: Download exact producer artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
      with:
        name: native-contract-${{ inputs.producer-run-id }}-${{ inputs.producer-run-attempt }}
        path: ${{ runner.temp }}/native-contract
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer-run-id }}
    - name: Verify artifact and candidate identity
      shell: bash
      env:
        ARTIFACT_ROOT: ${{ runner.temp }}/native-contract
        EXPECTED_PRODUCER_RUN_ATTEMPT: ${{ inputs.producer-run-attempt }}
        EXPECTED_PRODUCER_RUN_ID: ${{ inputs.producer-run-id }}
        EXPECTED_REVISION_SHA: ${{ inputs.candidate-revision-sha }}
      run: >-
        node scripts/contract-artifact.mjs verify
        --artifact-root "$ARTIFACT_ROOT"
        --expected-clients-repository "$GITHUB_REPOSITORY"
        --expected-producer-run-id "$EXPECTED_PRODUCER_RUN_ID"
        --expected-producer-run-attempt "$EXPECTED_PRODUCER_RUN_ATTEMPT"
        --expected-revision-sha "$EXPECTED_REVISION_SHA"
    - name: Check out exact candidate revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ inputs.candidate-revision-sha }}
        path: candidate-clients
        persist-credentials: false
    - name: Install candidate tooling
      shell: bash
      working-directory: candidate-clients
      run: pnpm install --frozen-lockfile
