version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - coverage-check
        - no-mistakes
        - pr-shepherd
        - vouchington-tooling
    open-pull-requests-limit: 5
    groups:
      tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
      tooling-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: nuget
    directory: /dotnet-clients
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      xunit:
        applies-to: version-updates
        patterns:
          - xunit.analyzers
          - xunit.runner.visualstudio
          - xunit.v3
      xunit-security:
        applies-to: security-updates
        patterns:
          - xunit.analyzers
          - xunit.runner.visualstudio
          - xunit.v3

  - package-ecosystem: swift
    directory: /swift-clients/core
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      apple-swift-crypto:
        applies-to: version-updates
        patterns:
          - swift-crypto
          - swift-asn1
      apple-swift-crypto-security:
        applies-to: security-updates
        patterns:
          - swift-crypto
          - swift-asn1

  - package-ecosystem: swift
    directory: /swift-clients/ui
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      apple-swift-crypto:
        applies-to: version-updates
        patterns:
          - swift-crypto
          - swift-asn1
      apple-swift-crypto-security:
        applies-to: security-updates
        patterns:
          - swift-crypto
          - swift-asn1

  - package-ecosystem: swift
    directory: /swift-clients/apps/android
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      apple-swift-crypto:
        applies-to: version-updates
        patterns:
          - swift-crypto
          - swift-asn1
      apple-swift-crypto-security:
        applies-to: security-updates
        patterns:
          - swift-crypto
          - swift-asn1
      skip-toolchain:
        applies-to: version-updates
        patterns:
          - 'skip*'
      skip-toolchain-security:
        applies-to: security-updates
        patterns:
          - 'skip*'
