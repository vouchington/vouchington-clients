version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - coverage-check
        - vouchington-tooling
    open-pull-requests-limit: 5
    groups:
      first-party-minor-and-patch:
        applies-to: version-updates
        patterns:
          - coverage-check
          - vouchington-tooling
        update-types:
          - minor
          - patch
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /dotnet-clients
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      nuget-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /swift-clients/core
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      swift-core-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      swift-core-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /swift-clients/ui
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      swift-ui-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      swift-ui-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /swift-clients/apps/android
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      swift-android-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      swift-android-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
