name: Scratch concurrent pressure repro consumer
on:
  workflow_run:
    workflows: [Scratch concurrent pressure repro source]
    types: [completed]

concurrency:
  group: scratch-concurrent-pressure-repro-consumer-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, Linux]
    concurrency:
      group: scratch-concurrent-pressure-repro
      queue: max
      cancel-in-progress: false
    steps:
      - run: echo "concurrent pressure repro ran on ${{ github.event.workflow_run.head_branch }} at $(date -u +%s)"
