name: Native contract producer
run-name: >-
  Native contract producer for PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }} updated ${{ github.event.pull_request.updated_at }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: native-contract-producer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  open-check:
    name: Create required contract parity check
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Create required contract parity check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          external_id="native-contract-producer:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Filaments contract parity' \
            -f head_sha="$PR_HEAD_SHA" \
            -f status=in_progress \
            -f external_id="$external_id" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f 'output[title]=Native contract tests are pending' \
            -f 'output[summary]=The trusted producer is preparing the exact contract artifact.' \
            --silent

  produce:
    name: Publish verified native contracts
    needs: open-check
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Clean persistent runner workspace
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace
      - name: Check out trusted client tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Clean persistent runner workspace
        if: always()
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace
      - name: Assert authorized Filaments source
        run: >-
          jq -e
          '.repository == "jonathanong/filaments" and .ref == "main"'
          contracts/filaments.json
      - name: Check out candidate clients as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate-clients
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Check out Filaments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jonathanong/filaments
          ref: main
          path: filaments
          ssh-key: ${{ secrets.FILAMENTS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Resolve immutable checkout identities
        id: identities
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate-clients
          FILAMENTS_ROOT: ${{ github.workspace }}/filaments
        run: |
          set -euo pipefail
          printf 'candidate_merge_sha=%s\n' "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          printf 'filaments_sha=%s\n' "$(git -C "$FILAMENTS_ROOT" rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Stage trusted native contract
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate-clients
          CONTRACT_STAGE_ROOT: ${{ runner.temp }}/native-contract-stage-${{ github.run_id }}-${{ github.run_attempt }}
          FILAMENTS_ROOT: ${{ github.workspace }}/filaments
        run: |
          set -euo pipefail
          mkdir -p "$CONTRACT_STAGE_ROOT"
          node scripts/stage-native-contract.mjs \
            --filaments-root "$FILAMENTS_ROOT" \
            --output-root "$CONTRACT_STAGE_ROOT" \
            --consumer-root "$CANDIDATE_ROOT"
      - name: Assert candidate generated localization parity
        env:
          VOUCHA_FILAMENTS_CONTRACT_ROOT: ${{ runner.temp }}/native-contract-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          node scripts/contracts.mjs check
          --destination-root "${{ github.workspace }}/candidate-clients"
      - name: Create verified contract artifact
        id: artifact
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/native-contract-${{ github.run_id }}-${{ github.run_attempt }}
          FILAMENTS_ROOT: ${{ runner.temp }}/native-contract-stage-${{ github.run_id }}-${{ github.run_attempt }}
          FILAMENTS_SHA: ${{ steps.identities.outputs.filaments_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ steps.identities.outputs.candidate_merge_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node scripts/contract-artifact.mjs create \
            --filaments-root "$FILAMENTS_ROOT" \
            --output-root "$ARTIFACT_ROOT" \
            --filaments-sha "$FILAMENTS_SHA" \
            --clients-repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --merge-sha "$MERGE_SHA" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT"
          printf 'path=%s\n' "$ARTIFACT_ROOT" >>"$GITHUB_OUTPUT"
      - name: Upload native contracts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: native-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Clean persistent runner workspace
        if: always()
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace
