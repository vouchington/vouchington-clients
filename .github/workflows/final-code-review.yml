name: Final Code Review

on:
  pull_request_target:
    types: [labeled, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: final-code-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.action }}-${{ github.event.label.name || 'none' }}
  cancel-in-progress: false

jobs:
  select-final-review:
    name: Select final review
    if: >-
      (github.event.action == 'ready_for_review' ||
      github.event.label.name == 'final-code-review:requested') &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux]
    timeout-minutes: 32
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      base_sha: ${{ steps.select.outputs.base_sha }}
    steps:
      - name: Select the exact PR head and wait for validation
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          READY_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          output() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          pr="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,headRefName,headRepository,baseRefOid,isDraft,isCrossRepository,author)"
          head_sha="$(jq -r '.headRefOid' <<<"$pr")"
          head_ref="$(jq -r '.headRefName' <<<"$pr")"
          head_repository="$(jq -r '.headRepository.nameWithOwner' <<<"$pr")"
          base_sha="$(jq -r '.baseRefOid' <<<"$pr")"
          author="$(jq -r '.author.login' <<<"$pr")"
          is_draft="$(jq -r '.isDraft' <<<"$pr")"
          is_cross_repository="$(jq -r '.isCrossRepository' <<<"$pr")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Missing PR head SHA.'; exit 1; }
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Missing PR base SHA.'; exit 1; }
          [ "$EVENT_HEAD_SHA" = "$head_sha" ] || {
            echo "::error::Event head $EVENT_HEAD_SHA is stale; current head is $head_sha."
            exit 1
          }
          output pr_number "$PR_NUMBER"
          output head_sha "$head_sha"
          output base_sha "$base_sha"

          validation_state() {
            local candidate run_id status jobs result
            candidate="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$head_sha&event=pull_request&per_page=20" \
              | jq -r --arg head "$head_sha" --argjson pr "$PR_NUMBER" --arg head_repo "$head_repository" --arg head_ref "$head_ref" --arg action "$EVENT_ACTION" --arg ready_at "$READY_AT" '
                [.workflow_runs[] | select(
                  .event == "pull_request" and
                  .head_sha == $head and
                  .path == ".github/workflows/validate.yml" and
                  (any(.pull_requests[]?; .number == $pr) or
                   ((.pull_requests | length) == 0 and .head_repository.full_name == $head_repo and .head_branch == $head_ref)) and
                  ($action != "ready_for_review" or .created_at >= $ready_at)
                )] | sort_by(.created_at) | last // empty | [.id, .status] | @tsv')"
            if [ -z "$candidate" ]; then echo pending; return; fi
            IFS=$'\t' read -r run_id status <<<"$candidate"
            if [ "$status" != completed ]; then echo pending; return; fi
            jobs="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs)"
            result="$(jq -r '[.jobs[] | select(.name == "validate") | .conclusion] | last // "pending"' <<<"$jobs")"
            if [ "$result" = success ]; then echo success; return; fi
            echo failed
          }

          for attempt in $(seq 1 120); do
            current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json headRefOid --jq .headRefOid)"
            [ "$current" = "$head_sha" ] || {
              echo "::error::PR head changed from $head_sha to $current while waiting for validation."
              exit 1
            }
            state="$(validation_state)"
            if [ "$state" = success ]; then break; fi
            if [ "$state" = failed ]; then
              echo "::error::The exact-head Validate run failed for $head_sha."
              exit 1
            fi
            if [ "$attempt" = 120 ]; then
              echo "::error::Timed out waiting for the exact-head Validate run for $head_sha."
              exit 1
            fi
            sleep 15
          done

          dependency_bot=false
          case "$author" in
            dependabot|'dependabot[bot]'|app/dependabot|renovate|'renovate[bot]'|app/renovate)
              dependency_bot=true
              ;;
          esac
          if [ "$is_cross_repository" = true ] || [ "$dependency_bot" = true ]; then
            output mode pass-through
          elif [ "$is_draft" = true ]; then
            output mode deferred
          else
            output mode trusted
          fi

  validate-review-settings:
    name: Validate code review settings
    needs: [select-final-review]
    if: needs.select-final-review.outputs.mode == 'trusted'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Validate required organization variables
        env:
          OPENROUTER_ENABLED: ${{ vars.OPENCODE_CODE_REVIEW_ENABLED }}
          OPENROUTER_MODEL: ${{ vars.OPENCODE_CODE_REVIEW_MODEL }}
          ZEN_ENABLED: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_ENABLED }}
          ZEN_MODEL: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          boolean() {
            case "$2" in true|false) ;; *) echo "::error::$1 must be exactly true or false"; exit 1;; esac
          }
          boolean OPENCODE_CODE_REVIEW_ENABLED "$OPENROUTER_ENABLED"
          boolean OPENCODE_ZEN_CODE_REVIEW_ENABLED "$ZEN_ENABLED"
          if [ "$OPENROUTER_ENABLED" = true ]; then
            [ -n "$OPENROUTER_MODEL" ] || { echo '::error::OPENCODE_CODE_REVIEW_MODEL is required'; exit 1; }
          fi
          if [ "$ZEN_ENABLED" = true ]; then
            [ -n "$ZEN_MODEL" ] || { echo '::error::OPENCODE_ZEN_CODE_REVIEW_MODEL is required'; exit 1; }
          fi

  provider-review:
    name: ${{ matrix.provider_name }} Review
    needs: [select-final-review, validate-review-settings]
    if: >-
      needs.select-final-review.outputs.mode == 'trusted' &&
      needs.validate-review-settings.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openrouter
            provider_name: OpenCode OpenRouter
            artifact: opencode-openrouter
            enabled: ${{ vars.OPENCODE_CODE_REVIEW_ENABLED }}
            model: ${{ vars.OPENCODE_CODE_REVIEW_MODEL }}
          - provider: zen
            provider_name: OpenCode Zen
            artifact: opencode-zen
            enabled: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_ENABLED }}
            model: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_MODEL }}
    # The required gate waits for this attempt but never requires provider success.
    continue-on-error: true
    runs-on: [self-hosted, Linux]
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Clean persistent runner workspace
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-final-review.outputs.base_sha }}
          clean: false
          persist-credentials: false

      - name: Run advisory review
        id: review
        if: matrix.enabled == 'true'
        continue-on-error: true
        uses: vouchington/vouchington-tooling/.github/actions/opencode-code-review@7226e68cfefeb5d60034a76186609387a82387d0
        with:
          pr_number: ${{ needs.select-final-review.outputs.pr_number }}
          provider_name: ${{ matrix.provider_name }}
          trusted_prompt_ref: ${{ needs.select-final-review.outputs.base_sha }}
          prompt_path: docs/prompts/code-review.md
          inline_prompt_path: docs/prompts/code-review-inline-comments.md
          model: ${{ matrix.model }}
          payload_artifact_name: ${{ matrix.artifact }}
          openrouter_api_key: ${{ matrix.provider == 'openrouter' && secrets.OPENROUTER_FREE_API_KEY || '' }}
          opencode_api_key: ${{ matrix.provider == 'zen' && secrets.OPENCODE_FREE_API_KEY || '' }}

      - name: Require the selected PR head before posting
        id: head-check
        if: steps.review.outputs.payload_artifact_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select-final-review.outputs.pr_number }}
          SELECTED_HEAD_SHA: ${{ needs.select-final-review.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$current" = "$SELECTED_HEAD_SHA" ] || { echo '::error::PR head changed before posting.'; exit 1; }

      - name: Post advisory review
        id: poster
        if: >-
          steps.head-check.outcome == 'success' &&
          steps.review.outputs.payload_artifact_id != ''
        continue-on-error: true
        uses: vouchington/vouchington-tooling/.github/actions/code-review-poster@7226e68cfefeb5d60034a76186609387a82387d0
        with:
          pr_number: ${{ needs.select-final-review.outputs.pr_number }}
          artifact_id: ${{ steps.review.outputs.payload_artifact_id }}
          provider_name: ${{ matrix.provider_name }}
          token_source: github-token

      - name: Record advisory outcome
        if: always()
        env:
          ENABLED: ${{ matrix.enabled }}
          PROVIDER_NAME: ${{ matrix.provider_name }}
          ACTION_OUTCOME: ${{ steps.review.outcome }}
          AGENT_OUTCOME: ${{ steps.review.outputs.agent_outcome }}
          POSTER_STEP_OUTCOME: ${{ steps.poster.outcome }}
          POSTER_OUTCOME: ${{ steps.poster.outputs.poster_outcome }}
        run: |
          set -euo pipefail
          if [ "$ENABLED" != true ]; then
            echo "$PROVIDER_NAME review is disabled."
          elif [ "$ACTION_OUTCOME" != success ] || [ "$AGENT_OUTCOME" != success ]; then
            echo "::warning::$PROVIDER_NAME review did not complete successfully; this is advisory."
          elif [ "$POSTER_STEP_OUTCOME" != skipped ] && [ "$POSTER_OUTCOME" != success ]; then
            echo "::warning::$PROVIDER_NAME review poster did not complete successfully; this is advisory."
          fi
      - name: Clean persistent runner workspace
        if: always()
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  code-reviewed:
    name: >-
      ${{ (github.event.action == 'ready_for_review' || github.event.label.name == 'final-code-review:requested') && github.event.pull_request.draft == false && 'Code Reviewed' || 'Ignore final review request' }}
    needs: [select-final-review, validate-review-settings, provider-review]
    if: >-
      always() && (github.event.action == 'ready_for_review' ||
      github.event.label.name == 'final-code-review:requested') &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require successful final-review orchestration
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_RESULT: ${{ needs.select-final-review.result }}
          SETTINGS_RESULT: ${{ needs.validate-review-settings.result }}
          MODE: ${{ needs.select-final-review.outputs.mode }}
          PR_NUMBER: ${{ needs.select-final-review.outputs.pr_number }}
          SELECTED_HEAD_SHA: ${{ needs.select-final-review.outputs.head_sha }}
        run: |
          set -euo pipefail
          [ "$SELECT_RESULT" = success ] || { echo '::error::Review selection failed.'; exit 1; }
          case "$MODE" in
            pass-through) exit 0 ;;
            deferred)
              live_draft="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
              [ "$live_draft" = true ] && { echo 'Final code review stopped because the PR became a draft.'; exit 0; }
              echo '::error::Final code review is unexpectedly deferred.'; exit 1 ;;
            trusted) ;;
            *) echo "::error::Unknown final review mode: $MODE"; exit 1 ;;
          esac
          [ "$SETTINGS_RESULT" = success ] || { echo '::error::Code review settings are invalid.'; exit 1; }
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$current" = "$SELECTED_HEAD_SHA" ] || { echo '::error::PR head changed before completion.'; exit 1; }
          echo '::notice::Provider and poster outcomes are advisory; exact-head validation and orchestration are authoritative.'
          echo 'Provider and poster outcomes are advisory; exact-head validation and orchestration are authoritative.' >> "$GITHUB_STEP_SUMMARY"
