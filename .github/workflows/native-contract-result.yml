name: Native contract result
run-name: Report native contract result for consumer ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [Native contract tests]
    types: [completed]

permissions: {}

concurrency:
  group: native-contract-result-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  report:
    name: Report native contract result
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      pull-requests: read
    steps:
      - name: Complete the exact required contract parity check
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CONSUMER_RUN_ID: ${{ github.event.workflow_run.id }}
          CONSUMER_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          pattern='^Native contract tests for producer ([0-9]+) attempt ([0-9]+) PR #([0-9]+) head ([0-9a-f]{40})$'
          [[ "$CONSUMER_TITLE" =~ $pattern ]] || {
            echo '::error::Native contract consumer title does not contain an exact producer and pull request identity.'
            exit 1
          }
          producer_id="${BASH_REMATCH[1]}"
          producer_attempt="${BASH_REMATCH[2]}"
          pr_number="${BASH_REMATCH[3]}"
          head_sha="${BASH_REMATCH[4]}"
          producer="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$producer_id")"
          jq -e \
            --argjson attempt "$producer_attempt" \
            --argjson pr "$pr_number" \
            --arg head "$head_sha" '
              .path == ".github/workflows/native-contract-producer.yml" and
              .event == "pull_request_target" and
              .run_attempt == $attempt and
              .status == "completed" and
              .head_sha == $head and
              any(.pull_requests[]?; .number == $pr and .head.sha == $head)
            ' <<<"$producer" >/dev/null || {
              echo '::error::Native contract producer identity does not match the completed consumer.'
              exit 1
            }
          producer_conclusion="$(jq -r '.conclusion // "failure"' <<<"$producer")"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          live_head="$(jq -r '.head.sha' <<<"$pr")"
          live_state="$(jq -r '.state' <<<"$pr")"

          external_id="native-contract-producer:${producer_id}:${producer_attempt}"
          checks="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs" \
            -f filter=all -f per_page=100 --paginate --slurp)"
          matches="$(jq -c --arg external_id "$external_id" '[
            .[].check_runs[] |
            select(
              .name == "Filaments contract parity" and
              .app.slug == "github-actions" and
              .external_id == $external_id
            )
          ]' <<<"$checks")"
          [ "$(jq 'length' <<<"$matches")" -eq 1 ] || {
            echo '::error::Expected exactly one contract parity check for the producer attempt.'
            exit 1
          }
          check_id="$(jq -r '.[0].id' <<<"$matches")"

          if [ "$live_state" != open ] || [ "$live_head" != "$head_sha" ]; then
            conclusion=cancelled
            summary="PR #$pr_number no longer has $head_sha as its open head."
          elif [ "$producer_conclusion" = success ] && [ "$CONSUMER_CONCLUSION" = success ]; then
            conclusion="success"
            summary="Producer $producer_id attempt $producer_attempt and consumer $CONSUMER_RUN_ID succeeded."
          elif [ "$producer_conclusion" = timed_out ] || [ "$CONSUMER_CONCLUSION" = timed_out ]; then
            conclusion=timed_out
            summary="The native contract producer or consumer timed out."
          elif [ "$producer_conclusion" = cancelled ] || [ "$CONSUMER_CONCLUSION" = cancelled ]; then
            conclusion=cancelled
            summary="The native contract producer or consumer was cancelled."
          else
            conclusion=failure
            summary="Producer conclusion: $producer_conclusion; consumer conclusion: $CONSUMER_CONCLUSION."
          fi

          completed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
            -f name='Filaments contract parity' \
            -f conclusion="$conclusion" \
            -f completed_at="$completed_at" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CONSUMER_RUN_ID" \
            -f 'output[title]=Native contract tests completed' \
            -f "output[summary]=$summary" \
            --silent
          [ "$conclusion" = success ] || {
            echo "::error::$summary"
            exit 1
          }
