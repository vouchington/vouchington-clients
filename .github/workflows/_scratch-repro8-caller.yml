name: Scratch repro8 caller

on:
  push:
    branches:
      - scratch-repro8-fire

concurrency:
  group: scratch-repro8-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Scratch gate
    runs-on: [self-hosted, Linux]
    timeout-minutes: 2
    concurrency:
      group: scratch-repro8-fleet-admission
      queue: max
      cancel-in-progress: false
    steps:
      - run: echo "gate ran"

  dispatch:
    name: Scratch dispatch caller
    needs: [gate]
    uses: ./.github/workflows/_scratch-repro8-callee.yml
    secrets:
      SCRATCH_SECRET: ${{ secrets.HARNESS_API_KEY }}
    with:
      concurrency-id: repro8-${{ github.run_id }}
