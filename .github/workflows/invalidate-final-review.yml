name: Invalidate Final Review

on:
  pull_request_target:
    types: [reopened, ready_for_review, converted_to_draft, closed]

permissions: {}

concurrency:
  group: invalidate-final-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  invalidate:
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 2
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Queue exact-head final review
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_json=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r '.head.sha' <<< "$pr_json")" = "$EVENT_HEAD_SHA" || exit 0
          case "$EVENT_ACTION" in
            reopened|ready_for_review)
              test "$(jq -r '.state' <<< "$pr_json")" = open || exit 0
              test "$(jq -r '.draft' <<< "$pr_json")" = false || exit 0
              ;;
            converted_to_draft)
              test "$(jq -r '.state' <<< "$pr_json")" = open || exit 0
              test "$(jq -r '.draft' <<< "$pr_json")" = true || exit 0
              ;;
            closed) ;;
            *) exit 1 ;;
          esac
          jq -n \
            --arg name 'Code Reviewed' \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg status queued \
            --arg external_id "$EVENT_ACTION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg details_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{$name,$head_sha,$status,$external_id,$details_url}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --silent
