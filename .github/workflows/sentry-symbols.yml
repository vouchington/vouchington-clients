name: Upload trusted Sentry symbols

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      project:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    # Callers also gate collection. Reject PR and arbitrary branch dispatch inputs.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ios-v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sentry-release
    steps:
      - name: Download symbols from this trusted run
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/sentry-symbols
      - name: Install checksummed Sentry CLI
        timeout-minutes: 3
        env:
          SENTRY_CLI_VERSION: 3.8.2
          # Public upstream release-asset SHA256, not an authentication token.
          SENTRY_CLI_SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3 # gitleaks:allow
        run: |
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 \
            "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI_VERSION/sentry-cli-Linux-x86_64" \
            --output "$RUNNER_TEMP/sentry-cli"
          printf '%s  %s\n' "$SENTRY_CLI_SHA256" "$RUNNER_TEMP/sentry-cli" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/sentry-cli"
      - name: Upload debug files when configured
        timeout-minutes: 5
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ inputs.project }}
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_ORG" || -z "$SENTRY_PROJECT" ]]; then
            echo 'Sentry symbol upload disabled: configure token, organization, and project in sentry-release.'
            exit 0
          fi
          "$RUNNER_TEMP/sentry-cli" debug-files upload "$RUNNER_TEMP/sentry-symbols"
