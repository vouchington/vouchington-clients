  native-dto-fixture-parity:
    name: Native DTO fixture parity (advisory)
    if: ${{ !cancelled() }}
    needs:
      - dotnet-portable
      - test-swift-core
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report missing native DTO fields
        env:
          DOTNET_OUTCOME: ${{ needs.dotnet-portable.outputs.dto-fixture-parity-outcome }}
          SWIFT_OUTCOME: ${{ needs.test-swift-core.outputs.dto-fixture-parity-outcome }}
        run: |
          set -euo pipefail
          if [[ "$DOTNET_OUTCOME" != success || "$SWIFT_OUTCOME" != success ]]; then
            echo "::error::Native DTO fixture parity failed (Swift: $SWIFT_OUTCOME; .NET: $DOTNET_OUTCOME). One or both clients drop fields from verified API fixtures."
            exit 1
          fi

  tests:
    name: Tests
    if: ${{ !cancelled() }}
    needs:
      - produce
      - verify
      - dotnet-portable
      - periphery-swift-core
      - periphery-swift-ui
      - test-swift-core-linux
      - test-swift-core
      - test-swift-android
      - test-swift-ui
      - build-swift-ui-tests
      - swift-patch-coverage
      - build-android-core
      - build-macos-app
      - build-ios-app
      - build-ios-ipad
      - build-ios-x86
      - dotnet-maui-compile
      - dotnet-maui
      - dotnet-windows-image-preview
      - dotnet-windows-language-model-surface
      - dotnet-windows-maui
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every native test job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WINDOWS_IMAGE_PREVIEW_ROUTE: ${{ needs.verify.outputs.windows-image-preview }}
          WINDOWS_LANGUAGE_MODEL_SURFACE_ROUTE: ${{ needs.verify.outputs.windows-language-model-surface }}
          WINDOWS_MAUI_ROUTE: ${{ needs.verify.outputs.windows-maui }}
        run: |
          set -euo pipefail
          jq -e --arg route "$WINDOWS_IMAGE_PREVIEW_ROUTE" --arg maui "$WINDOWS_MAUI_ROUTE" --arg surface "$WINDOWS_LANGUAGE_MODEL_SURFACE_ROUTE" '
            all(to_entries[] | select(.key != "dotnet-windows-image-preview" and .key != "dotnet-windows-language-model-surface" and .key != "dotnet-windows-maui"); .value.result == "success") and
            ((."dotnet-windows-image-preview".result == "success") or
             ($route == "false" and ."dotnet-windows-image-preview".result == "skipped")) and
            ((."dotnet-windows-language-model-surface".result == "success") or
             ($surface == "false" and ."dotnet-windows-language-model-surface".result == "skipped")) and
            ((."dotnet-windows-maui".result == "success") or
             ($maui == "false" and ."dotnet-windows-maui".result == "skipped"))
          ' <<<"$NEEDS_JSON"
