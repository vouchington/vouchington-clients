name: Native contract tests
run-name: >-
  Native contract tests for ${{ github.event.pull_request.number && format('PR #{0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('main at {0}', github.sha) }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: native-contract-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  produce:
    name: Publish verified native contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Resolve candidate event identity
        id: event
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            candidate_event=pull_request
            candidate_number="$PR_NUMBER"
            candidate_ref="refs/pull/$PR_NUMBER/merge"
            trusted_ref="$EVENT_SHA"
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = push ] && [ "$EVENT_REF" = refs/heads/main ]; then
            [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
            candidate_event=push
            candidate_number=
            candidate_ref="$EVENT_SHA"
            trusted_ref="$EVENT_SHA"
            base_sha="$EVENT_BEFORE"
            head_sha="$EVENT_SHA"
          else
            echo "::error::Unsupported native test event $EVENT_NAME on $EVENT_REF"
            exit 1
          fi
          {
            printf 'candidate_event=%s\n' "$candidate_event"
            printf 'candidate_number=%s\n' "$candidate_number"
            printf 'candidate_ref=%s\n' "$candidate_ref"
            printf 'trusted_ref=%s\n' "$trusted_ref"
            printf 'base_sha=%s\n' "$base_sha"
            printf 'head_sha=%s\n' "$head_sha"
          } >>"$GITHUB_OUTPUT"
      - name: Check out client tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.event.outputs.trusted_ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          NPM_CONFIG_AUDIT: 'false'
        with:
          version: latest-12
      - name: Check out candidate clients as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.event.outputs.candidate_ref }}
          path: candidate-clients
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Assert authorized Vouchington source
        run: >-
          jq -e
          '.repository == "vouchington/vouchington" and .ref == "main"'
          candidate-clients/contracts/filaments.json
      - name: Check out Vouchington
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington
          ref: main
          path: filaments
          persist-credentials: false
      - name: Resolve immutable checkout identities
        id: identities
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate-clients
          FILAMENTS_ROOT: ${{ github.workspace }}/filaments
        run: |
          set -euo pipefail
          printf 'candidate_revision_sha=%s\n' "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          printf 'filaments_sha=%s\n' "$(git -C "$FILAMENTS_ROOT" rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Restore Vouchington pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-pnpm-vouchington-${{ hashFiles('filaments/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-vouchington-
      - name: Install trusted Vouchington exporter dependencies
        working-directory: filaments
        env:
          pnpm_config_store_dir: ${{ runner.temp }}/pnpm-store
        run: pnpm install --frozen-lockfile
      - name: Stage trusted native contract
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate-clients
          CONTRACT_STAGE_ROOT: ${{ runner.temp }}/native-contract-stage-${{ github.run_id }}-${{ github.run_attempt }}
          FILAMENTS_ROOT: ${{ github.workspace }}/filaments
        run: |
          set -euo pipefail
          mkdir -p "$CONTRACT_STAGE_ROOT"
          node scripts/stage-native-contract.mjs \
            --filaments-root "$FILAMENTS_ROOT" \
            --output-root "$CONTRACT_STAGE_ROOT" \
            --consumer-root "$CANDIDATE_ROOT"
      - name: Assert extracted localization representatives
        env:
          CONTRACT_STAGE_ROOT: ${{ runner.temp }}/native-contract-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          node scripts/assert-extracted-localization.mjs
          --contract-root "$CONTRACT_STAGE_ROOT"
      - name: Assert candidate generated localization parity
        env:
          VOUCHA_FILAMENTS_CONTRACT_ROOT: ${{ runner.temp }}/native-contract-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          node scripts/contracts.mjs check
          --destination-root "${{ github.workspace }}/candidate-clients"
      - name: Create verified contract artifact
        id: artifact
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/native-contract-${{ github.run_id }}-${{ github.run_attempt }}
          FILAMENTS_ROOT: ${{ runner.temp }}/native-contract-stage-${{ github.run_id }}-${{ github.run_attempt }}
          FILAMENTS_SHA: ${{ steps.identities.outputs.filaments_sha }}
          BASE_SHA: ${{ steps.event.outputs.base_sha }}
          CANDIDATE_EVENT: ${{ steps.event.outputs.candidate_event }}
          CANDIDATE_NUMBER: ${{ steps.event.outputs.candidate_number }}
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          REVISION_SHA: ${{ steps.identities.outputs.candidate_revision_sha }}
        run: |
          set -euo pipefail
          candidate_args=(--candidate-event "$CANDIDATE_EVENT")
          if [ "$CANDIDATE_EVENT" = pull_request ]; then
            candidate_args+=(--candidate-number "$CANDIDATE_NUMBER")
          fi
          node scripts/contract-artifact.mjs create \
            --filaments-root "$FILAMENTS_ROOT" \
            --output-root "$ARTIFACT_ROOT" \
            --contract-repository vouchington/vouchington \
            --filaments-sha "$FILAMENTS_SHA" \
            --clients-repository "$GITHUB_REPOSITORY" \
            "${candidate_args[@]}" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --revision-sha "$REVISION_SHA" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT"
          printf 'path=%s\n' "$ARTIFACT_ROOT" >>"$GITHUB_OUTPUT"
      - name: Upload native contracts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: native-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  verify:
    name: Verify native contract handoff
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      base-sha: ${{ steps.identity.outputs.base_sha }}
      revision-sha: ${{ steps.identity.outputs.revision_sha }}
      windows-image-preview: ${{ steps.windows-image-preview-route.outputs.windows-image-preview }}
      windows-language-model-surface: ${{ steps.windows-language-model-surface-route.outputs.windows-language-model-surface }}
      windows-maui: ${{ steps.windows-maui-route.outputs.windows-maui }}
    steps:
      - name: Check out consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download exact producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: native-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-contract
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Verify artifact bytes and producer identity
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/native-contract
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node scripts/contract-artifact.mjs verify
          --artifact-root "$ARTIFACT_ROOT"
          --expected-contract-repository vouchington/vouchington
          --expected-clients-repository "$GITHUB_REPOSITORY"
          --expected-producer-run-id "$PRODUCER_RUN_ID"
          --expected-producer-run-attempt "$PRODUCER_RUN_ATTEMPT"
      - name: Validate candidate event identity
        id: identity
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/native-contract
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { validatePullRequestCandidate } from './scripts/validate-native-contract-candidate.mjs'

          const manifest = JSON.parse(readFileSync(`${process.env.ARTIFACT_ROOT}/manifest.json`, 'utf8'))
          if (process.env.EVENT_NAME === 'pull_request') {
            const identity = validatePullRequestCandidate({
              candidate: manifest.candidate,
              event: {
                number: process.env.PR_NUMBER,
                baseSha: process.env.PR_BASE_SHA,
                headSha: process.env.PR_HEAD_SHA,
              },
              readPullRequest: number => JSON.parse(execFileSync('gh', [
                'api',
                `repos/${manifest.clientsRepository}/pulls/${number}`,
              ], { encoding: 'utf8' })),
              readCurrentMergeRevision: number => JSON.parse(execFileSync('gh', [
                'api',
                `repos/${manifest.clientsRepository}/git/ref/pull/${number}/merge`,
              ], { encoding: 'utf8' })).object.sha,
            })
            appendFileSync(process.env.GITHUB_OUTPUT, `base_sha=${identity.baseSha}\n`)
            appendFileSync(process.env.GITHUB_OUTPUT, `revision_sha=${identity.revisionSha}\n`)
          } else if (process.env.EVENT_NAME === 'push' && process.env.EVENT_REF === 'refs/heads/main') {
            if (manifest.candidate.event !== 'push') throw new Error('artifact is not for a push')
            if (manifest.candidate.number !== null) throw new Error('push artifact has a pull request number')
            if (manifest.candidate.base !== process.env.EVENT_BEFORE) throw new Error('push base SHA changed')
            if (manifest.candidate.head !== process.env.EVENT_SHA) throw new Error('push head SHA changed')
            if (manifest.candidate.revision !== process.env.EVENT_SHA) throw new Error('push revision SHA changed')
            appendFileSync(process.env.GITHUB_OUTPUT, `base_sha=${manifest.candidate.base}\n`)
            appendFileSync(process.env.GITHUB_OUTPUT, `revision_sha=${manifest.candidate.revision}\n`)
          } else {
            throw new Error(`unsupported native test event ${process.env.EVENT_NAME}`)
          }

          NODE
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.revision_sha }}
          path: candidate-clients
          persist-credentials: false
      - name: Assert candidate against verified artifact
        env:
          VOUCHA_FILAMENTS_CONTRACT_ROOT: ${{ runner.temp }}/native-contract
        run: >-
          node candidate-clients/scripts/contracts.mjs check
          --destination-root "${{ github.workspace }}/candidate-clients"
      - name: Route Windows image preview tests from the exact candidate diff
        id: windows-image-preview-route
        working-directory: candidate-clients
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          REVISION_SHA: ${{ steps.identity.outputs.revision_sha }}
        run: node scripts/windows-image-preview-test-routing.mjs "$BASE_SHA" "$REVISION_SHA"
      - name: Route Windows MAUI build from the exact candidate diff
        id: windows-maui-route
        working-directory: candidate-clients
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          REVISION_SHA: ${{ steps.identity.outputs.revision_sha }}
        run: node scripts/windows-maui-test-routing.mjs "$BASE_SHA" "$REVISION_SHA"
      - name: Route Windows language-model surface probe from the exact candidate diff
        id: windows-language-model-surface-route
        working-directory: candidate-clients
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          REVISION_SHA: ${{ steps.identity.outputs.revision_sha }}
        run: node scripts/windows-language-model-surface-routing.mjs "$BASE_SHA" "$REVISION_SHA"
  dotnet-portable:
    name: .NET portable
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dto-fixture-parity-outcome: ${{ steps.dotnet-dto-fixture-parity.outcome }}
    env:
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - name: Check out consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prepare verified candidate
        uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Restore NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/voucha-dotnet-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('candidate-clients/dotnet-clients/**/*.lock.json', 'candidate-clients/dotnet-clients/Directory.Packages.props', 'candidate-clients/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Set up mise-managed .NET SDK
        uses: ./.github/actions/setup-mise-toolchain
        with:
          client-root: candidate-clients
          tool: dotnet
      - name: Restore, format, analyze, validate RESX, and build
        working-directory: candidate-clients
        run: ./dotnet-clients/tooling/harness.sh
      - name: Test portable solution with coverage
        working-directory: candidate-clients
        run: >-
          ./dotnet-clients/tooling/harness.sh --exec
          dotnet test Voucha.DotNet.sln
          --configuration Release --no-build
          --filter "FullyQualifiedName!~ApiFixtureCoverageTests.FixtureFieldsRoundTripThroughTheDto"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/core --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=lcov
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile=**/obj/**"
      - name: Test .NET DTO fixture parity separately
        id: dotnet-dto-fixture-parity
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: candidate-clients
        run: >-
          ./dotnet-clients/tooling/harness.sh --exec
          dotnet test Voucha.DotNet.sln
          --configuration Release --no-build
          --filter "FullyQualifiedName~ApiFixtureCoverageTests.FixtureFieldsRoundTripThroughTheDto"
      - name: Normalize Core coverage report
        working-directory: candidate-clients/dotnet-clients
        run: |
          set -euo pipefail
          reports="$(find TestResults/core -type f -name coverage.info -print)"
          [ "$(printf '%s\n' "$reports" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ] || {
            echo '::error::Expected exactly one coverage.info under TestResults/core.'
            exit 1
          }
          cp "$reports" TestResults/core/lcov.info
      - name: Upload .NET Core LCOV
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: dotnet-core-lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-clients/dotnet-clients/TestResults/core/lcov.info
          retention-days: 1
          if-no-files-found: error
      - name: Enforce Core patch coverage
        working-directory: candidate-clients
        env:
          COVERAGE_BASE: ${{ needs.verify.outputs.base-sha }}
          COVERAGE_HEAD: ${{ needs.verify.outputs.revision-sha }}
        run: pnpm run coverage:dotnet-core
  periphery-swift-core:
    name: Swift Periphery (core)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Select Xcode 26.6 Apple SDK and Swift compiler
        working-directory: candidate-clients
        run: bash dotnet-clients/tooling/select-xcode.sh 26.6
      - name: Set up mise-managed Swift compiler
        uses: ./.github/actions/setup-mise-toolchain
        with:
          client-root: candidate-clients
          tool: swift
      - uses: ./.github/actions/setup-swift-native
        with: { tools: periphery }
      - name: Find unused declarations in core
        working-directory: candidate-clients
        run: >-
          mise exec aqua:peripheryapp/periphery@3.7.4 --
          bash swift-clients/tooling/periphery-scan.sh core
  periphery-swift-ui:
    name: Swift Periphery (UI)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      VOUCHA_PERIPHERY_SWIFT_TOOLCHAIN: xcode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Select Xcode 26.6 Apple SDK and Swift compiler
        working-directory: candidate-clients
        run: bash dotnet-clients/tooling/select-xcode.sh 26.6
      - uses: ./.github/actions/setup-swift-native
        with: { tools: periphery }
      - name: Find unused declarations in UI
        working-directory: candidate-clients
        run: >-
          mise exec aqua:peripheryapp/periphery@3.7.4 --
          bash swift-clients/tooling/periphery-scan.sh ui
  test-swift-core-linux:
    name: Swift core tests (Linux)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Test core and test-support packages
        working-directory: candidate-clients
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/workspace"
          --volume "$VOUCHA_FILAMENTS_CONTRACT_ROOT:/contract:ro"
          --tmpfs /tmp:rw,exec,mode=1777
          --workdir /workspace --env HOME=/tmp --env TMPDIR=/tmp
          --env VOUCHA_FILAMENTS_CONTRACT_ROOT=/contract
          swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
          /bin/bash -c 'swift test --package-path swift-clients/test-support --force-resolved-versions
          --build-path /tmp/voucha-test-support-build --no-parallel
          && swift test --package-path swift-clients/core --force-resolved-versions
          --build-path /tmp/voucha-core-build --no-parallel
          --skip "VouchaCoreTests.ApiFixtureCoverageTests/testRegisteredFixturesRoundTripThroughTheirDTO"'
  test-swift-core:
    name: Swift core tests
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 22
    outputs:
      dto-fixture-parity-outcome: ${{ steps.swift-dto-fixture-parity.outcome }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Set up mise-managed Swift compiler
        uses: ./.github/actions/setup-mise-toolchain
        with:
          client-root: candidate-clients
          tool: swift
      - name: Test core package with coverage
        working-directory: candidate-clients
        run: >-
          mise exec -- swift test --package-path swift-clients/core
          --force-resolved-versions --disable-dependency-cache --enable-code-coverage
          --skip 'VouchaCoreTests.ApiFixtureCoverageTests/testRegisteredFixturesRoundTripThroughTheirDTO'
      - name: Export deterministic core LCOV
        working-directory: candidate-clients
        run: |
          llvm_cov="$(bash swift-clients/tooling/resolve-mise-swift.sh --llvm-cov)"
          bash swift-clients/tooling/write-lcov.sh swift-clients/core VouchaCoreTests coverage/core/lcov.info "$llvm_cov"
      - name: Upload core LCOV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: swift-core-lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-clients/coverage/core/lcov.info
          retention-days: 1
          if-no-files-found: error
      - name: Test Swift DTO fixture parity separately
        id: swift-dto-fixture-parity
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: candidate-clients
        run: >-
          mise exec -- swift test --package-path swift-clients/core
          --force-resolved-versions --disable-dependency-cache
          --filter 'VouchaCoreTests.ApiFixtureCoverageTests/testRegisteredFixturesRoundTripThroughTheirDTO'
  build-swift-android:
    name: Swift Android ${{ matrix.phase }}
    strategy:
      fail-fast: false
      matrix:
        phase: [app, test-libs]
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Restore checksummed Swift Android archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/voucha/swift-android/downloads
          key: ${{ runner.os }}-swift-android-archives-${{ hashFiles('candidate-clients/swift-clients/apps/android/tooling/materialize-skip-sdk.sh', '.github/workflows/native-contract-tests.yml') }}
      - name: Resolve Java for Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          if java -version >/dev/null 2>&1; then
            java_home="$({ java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/^[[:space:]]*java\.home[[:space:]]*=/ { print $2; exit }'; })"
          elif command -v brew >/dev/null 2>&1; then
            java_home="$(brew --prefix openjdk)/libexec/openjdk.jdk/Contents/Home"
          else
            echo '::error::Java is unavailable and Homebrew OpenJDK cannot be located.' >&2; exit 1
          fi
          [[ -n "$java_home" && -x "$java_home/bin/java" ]]
          "$java_home/bin/java" -version
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      - name: Select job-scoped Android SDK location
        shell: bash
        run: |
          android_sdk="$RUNNER_TEMP/android-sdk"
          rm -rf -- "$android_sdk"
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Set up mise-managed Swift compiler
        uses: ./.github/actions/setup-mise-toolchain
        with:
          client-root: candidate-clients
          tool: swift
      - name: Select Xcode 26.6 for Android host SwiftPM tests
        working-directory: candidate-clients
        run: bash dotnet-clients/tooling/select-xcode.sh 26.6
      - name: Configure Skip Swift home
        run: mkdir -p "$RUNNER_TEMP/skip-swift-home" && echo "VOUCHA_SKIP_SWIFT_HOME=$RUNNER_TEMP/skip-swift-home" >> "$GITHUB_ENV"
      - name: Remove obsolete Swift Android executable cache
        run: |
          cache_root="$HOME/.cache/voucha/swift-android"
          for cache_path in "$HOME/.cache" "$HOME/.cache/voucha" "$cache_root"; do
            [[ ! -L "$cache_path" && ( ! -e "$cache_path" || -d "$cache_path" ) ]] || { echo "unsafe Swift Android cache path: $cache_path" >&2; exit 1; }
          done
          rm -rf -- "$cache_root/extracted"
      - name: Prefetch and materialize Skip Swift Android SDK
        working-directory: candidate-clients
        timeout-minutes: 12
        run: |
          export VOUCHA_SWIFT_ANDROID_DOWNLOAD_DIR="$HOME/.cache/voucha/swift-android/downloads"
          mise exec -- bash swift-clients/apps/android/tooling/materialize-skip-sdk.sh
      - name: Resolve Android Swift package with shared artifact cache
        working-directory: candidate-clients
        run: |
          resolve_log="$RUNNER_TEMP/android-swift-resolve.log"
          mise exec -- swift package --disable-keychain --disable-netrc resolve --package-path swift-clients/apps/android --force-resolved-versions 2>&1 | tee "$resolve_log"
          ! grep -E 'Downloading binary artifact' "$resolve_log"
      - name: Test Android Swift package
        working-directory: candidate-clients
        run: >-
          bash swift-clients/apps/android/tooling/run-android-host-swift-tests.sh
          --package-path swift-clients/apps/android
          --filter VouchaAndroidTests
      - name: Restore Gradle user home
        if: matrix.phase == 'app'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/voucha/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('candidate-clients/swift-clients/apps/android/Package.resolved', 'candidate-clients/swift-clients/apps/android/Android/**/*.gradle.kts', 'candidate-clients/swift-clients/apps/android/Android/gradle/wrapper/gradle-wrapper.properties', 'candidate-clients/swift-clients/apps/android/tooling/materialize-skip-sdk.sh', 'candidate-clients/swift-clients/apps/android/Sources/VouchaAndroid/Skip/skip.yml') }}
      - name: Build the selected Android validation phase
        working-directory: candidate-clients
        env:
          VOUCHA_SKIP_SWIFT_HOME: ${{ runner.temp }}/skip-swift-home
          VOUCHA_BUILD_LOCK_COMMAND_TIMEOUT_SECONDS: 600
          VOUCHA_SKIP_ANDROID_HOST_SWIFT_TEST: '1'
          ANDROID_BUILD_PHASE: ${{ matrix.phase }}
        run: |
          export VOUCHA_SWIFT_ANDROID_DOWNLOAD_DIR="$HOME/.cache/voucha/swift-android/downloads"
          mise exec -- bash swift-clients/apps/android/tooling/pre-push.sh --phase "$ANDROID_BUILD_PHASE"
      - name: Package exact candidate Android app and instrumentation APKs
        if: matrix.phase == 'app'
        env:
          CANDIDATE_REVISION: ${{ needs.verify.outputs.revision-sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C candidate-clients rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
          app_apk=candidate-clients/swift-clients/apps/android/.build/Android/app/outputs/apk/debug/app-debug.apk
          test_apk=candidate-clients/swift-clients/apps/android/.build/Android/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          [[ -f "$app_apk" && -f "$test_apk" ]]
          bash candidate-clients/swift-clients/apps/android/tooling/run-cookie-restart-emulator.sh \
            verify-native-abi "$app_apk"
          proof_root="$RUNNER_TEMP/android-cookie-apks"
          mkdir -p "$proof_root"
          cp "$app_apk" "$proof_root/app-debug.apk"
          cp "$test_apk" "$proof_root/app-debug-androidTest.apk"
          printf '%s\n' "$CANDIDATE_REVISION" > "$proof_root/candidate-revision.txt"
          (cd "$proof_root" && shasum -a 256 app-debug.apk app-debug-androidTest.apk > sha256sums.txt)
      - name: Upload candidate Android APKs for runtime proof
        if: matrix.phase == 'app'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: android-cookie-apks-${{ needs.verify.outputs.revision-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-cookie-apks
          if-no-files-found: error
          retention-days: 1
  test-swift-android-cookie:
    name: Android cookie restart
    needs: [verify, build-swift-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact candidate runtime script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision-sha }}
          path: candidate-clients
          persist-credentials: false
      - name: Download exact candidate Android APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: android-cookie-apks-${{ needs.verify.outputs.revision-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-cookie-apks
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Reject invalid Android artifact and instrumentation results
        timeout-minutes: 1
        run: bash candidate-clients/swift-clients/apps/android/tooling/test-cookie-restart-runner.sh
      - name: Select job-scoped Android SDK location
        run: |
          android_sdk="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"
      - name: Install Android emulator Linux runtime libraries
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libpulse0 libpng16-16t64 libnss3 libexpat1 \
            libdrm2 libxi6 libxext6 libxkbfile1
      - name: Install Android emulator and API 35 Google APIs image
        timeout-minutes: 10
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;36.0.0
            emulator
            system-images;android-35;google_apis;x86_64
      - name: Enable Linux emulator acceleration
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]]
          sudo chmod 0666 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]]
      - name: Prove checked encrypted storage survives Android process restarts
        timeout-minutes: 12
        env:
          CANDIDATE_REVISION: ${{ needs.verify.outputs.revision-sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C candidate-clients rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
          bash candidate-clients/swift-clients/apps/android/tooling/run-cookie-restart-emulator.sh \
            run "$RUNNER_TEMP/android-cookie-apks" "$CANDIDATE_REVISION"
      - name: Upload Android runtime identity and bounded failure log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: android-cookie-runtime-${{ needs.verify.outputs.revision-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/voucha-cookie-runtime.txt
            ${{ runner.temp }}/voucha-cookie-emulator-failure-tail.log
          if-no-files-found: ignore
          retention-days: 1
  test-swift-android:
    name: Swift Android Skip
    needs: [verify, build-swift-android, test-swift-android-cookie]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both Android validation phases
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          ANDROID_PHASES_RESULT: ${{ needs.build-swift-android.result }}
          ANDROID_COOKIE_RESULT: ${{ needs.test-swift-android-cookie.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$ANDROID_PHASES_RESULT" = success
          test "$ANDROID_COOKIE_RESULT" = success
  build-swift-ui-tests:
    name: Swift UI build for testing
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Select Xcode 26.6 Apple SDK and Swift compiler
        working-directory: candidate-clients
        run: bash dotnet-clients/tooling/select-xcode.sh 26.6
      - name: Build complete UI test bundle with coverage
        timeout-minutes: 8
        working-directory: candidate-clients
        run: >-
          xcrun swift build --package-path swift-clients/ui --build-tests
          --force-resolved-versions --disable-dependency-cache --enable-code-coverage
      - name: Package exact UI test products
        timeout-minutes: 3
        env:
          EXPECTED_REVISION: ${{ needs.verify.outputs.revision-sha }}
        run: >-
          python3 scripts/swift-ui-test-artifact.py create
          "$GITHUB_WORKSPACE/candidate-clients/swift-clients/ui"
          "$RUNNER_TEMP/swift-ui-test-products.tar.gz"
          "$RUNNER_TEMP/swift-ui-test-products.json"
          --expected-revision "$EXPECTED_REVISION"
      - name: Upload UI test products
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: swift-ui-test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swift-ui-test-products.tar.gz
            ${{ runner.temp }}/swift-ui-test-products.json
          if-no-files-found: error
          retention-days: 1
  test-swift-ui:
    name: Swift UI tests and coverage
    needs: [verify, build-swift-ui-tests]
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Select Xcode 26.6 Apple SDK and Swift compiler
        working-directory: candidate-clients
        run: bash dotnet-clients/tooling/select-xcode.sh 26.6
      - name: Download exact UI test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: swift-ui-test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-ui-test-artifact
      - name: Verify and restore UI test products
        timeout-minutes: 3
        env:
          EXPECTED_REVISION: ${{ needs.verify.outputs.revision-sha }}
        run: >-
          python3 scripts/swift-ui-test-artifact.py verify
          "$GITHUB_WORKSPACE/candidate-clients/swift-clients/ui"
          "$RUNNER_TEMP/swift-ui-test-artifact/swift-ui-test-products.tar.gz"
          "$RUNNER_TEMP/swift-ui-test-artifact/swift-ui-test-products.json"
          --expected-revision "$EXPECTED_REVISION"
      - name: Record swift test start marker
        run: |
          mkdir -p "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/swift-ui-test-start-marker"
      - name: Test UI package with coverage
        timeout-minutes: 8
        working-directory: candidate-clients
        run: >-
          xcrun swift test --package-path swift-clients/ui
          --skip-build --force-resolved-versions --disable-dependency-cache --enable-code-coverage
      - name: Collect xctest crash reports
        if: ${{ failure() }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -euo pipefail
          collected="$RUNNER_TEMP/swift-ui-crash-reports"; mkdir -p "$collected"
          reports_dir="$HOME/Library/Logs/DiagnosticReports"; marker="$RUNNER_TEMP/swift-ui-test-start-marker"
          attempt=1
          while [ "$attempt" -le 6 ]; do
            if [ -d "$reports_dir" ]; then
              # shellcheck disable=SC2016
              find "$reports_dir" \( -name '*.ips' -o -name '*.crash' \) -newer "$marker" -print0 2>/dev/null | xargs -0 -I{} sh -c 'grep -q "VouchaUIPackageTests" "$1" 2>/dev/null && cp "$1" "$2" || true' _ {} "$collected"
            fi
            [ -z "$(ls -A "$collected" 2>/dev/null)" ] || break
            attempt=$((attempt + 1)); sleep 5
          done
      - name: Upload xctest crash reports
        if: ${{ failure() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          overwrite: true
          name: swift-ui-crash-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-ui-crash-reports
          retention-days: 1
          if-no-files-found: ignore
      - name: Export deterministic UI LCOV
        timeout-minutes: 3
        working-directory: candidate-clients
        run: bash swift-clients/tooling/write-lcov.sh swift-clients/ui VouchaUIPackageTests coverage/ui/lcov.info
      - name: Upload UI LCOV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: swift-ui-lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-clients/coverage/ui/lcov.info
          retention-days: 1
          if-no-files-found: error
  swift-patch-coverage:
