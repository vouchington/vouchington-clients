          NUGET_PACKAGES: ${{ runner.temp }}/voucha-windows-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/voucha-windows-nuget-http-cache
        run: dotnet restore dotnet-clients/tests/Voucha.Client.WindowsImagePreview.Tests/Voucha.Client.WindowsImagePreview.Tests.csproj --locked-mode --configfile dotnet-clients/NuGet.config -p:MSBuildEnableWorkloadResolver=false
      - name: Test the Windows image decoder
        working-directory: candidate-clients
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/voucha-windows-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/voucha-windows-nuget-http-cache
        run: dotnet test dotnet-clients/tests/Voucha.Client.WindowsImagePreview.Tests/Voucha.Client.WindowsImagePreview.Tests.csproj --configuration Release --no-restore -p:MSBuildEnableWorkloadResolver=false
  dotnet-windows-maui:
    name: .NET MAUI Windows
    needs: verify
    if: needs.verify.outputs.windows-maui == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prepare verified candidate
        uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/voucha-windows-nuget-packages
            ${{ runner.temp }}/voucha-windows-nuget-http-cache
          key: ${{ runner.os }}-nuget-windows-maui-${{ hashFiles('candidate-clients/dotnet-clients/src/**/*.lock.json', 'candidate-clients/dotnet-clients/Directory.Packages.props', 'candidate-clients/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-windows-maui-
      - name: Set up mise-managed .NET SDK
        uses: ./.github/actions/setup-mise-toolchain
        with:
          client-root: candidate-clients
          tool: dotnet
      - name: Install the pinned Windows MAUI workload
        timeout-minutes: 10
        working-directory: candidate-clients
        shell: pwsh
        run: |
          dotnet workload install maui-windows --configfile dotnet-clients/NuGet.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = (Get-Content global.json | ConvertFrom-Json).sdk.workloadVersion
          $actual = dotnet workload --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual.Trim() -ne $expected) { throw "Unexpected workload set: $actual (expected $expected)" }
      - name: Restore the locked Windows app graph
        timeout-minutes: 8
        working-directory: candidate-clients
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/voucha-windows-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/voucha-windows-nuget-http-cache
        run: >-
          dotnet restore dotnet-clients/src/Voucha.Client.App/Voucha.Client.App.csproj
          --locked-mode --configfile dotnet-clients/NuGet.config
          -p:TargetFramework=net10.0-windows10.0.26100.0 -p:RuntimeIdentifier=win-x64
          -p:Configuration=Release -p:EnableWindowsTargeting=true
      - name: Restore the referenced portable Core framework
        timeout-minutes: 5
        working-directory: candidate-clients
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/voucha-windows-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/voucha-windows-nuget-http-cache
        # The app restore's global TargetFramework also reaches Core; build resolves Core as net10.0.
        run: >-
          dotnet restore dotnet-clients/src/Voucha.Client.Core/Voucha.Client.Core.csproj
          --locked-mode --configfile dotnet-clients/NuGet.config
          -p:TargetFramework=net10.0 -p:Configuration=Release
      - name: Compile the actual Windows MAUI app
        timeout-minutes: 10
        working-directory: candidate-clients
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/voucha-windows-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/voucha-windows-nuget-http-cache
        run: >-
          dotnet build dotnet-clients/src/Voucha.Client.App/Voucha.Client.App.csproj
          --configuration Release --framework net10.0-windows10.0.26100.0 --no-restore
          -p:RuntimeIdentifier=win-x64 -p:WindowsPackageType=None
          -p:GenerateAppxPackageOnBuild=false -p:AppxPackageSigningEnabled=false
