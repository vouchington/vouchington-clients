        run: |
          xcodegen_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" --output "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip" -d "$xcodegen_root"
          xcodegen_bin="$xcodegen_root/xcodegen/bin/xcodegen"
          test -x "$xcodegen_bin"
          test "$("$xcodegen_bin" --version)" = "Version: ${XCODEGEN_VERSION}"
          dirname "$xcodegen_bin" >> "$GITHUB_PATH"
      - name: Verify hosted macOS GUI session
        run: |
          if [[ "$(uname -s)" != Darwin ]]; then
            echo "::error::macOS root-shell launch smoke requires a macOS GUI runner"
            exit 1
          fi
          if ! pgrep -qx WindowServer; then
            echo "::error::WindowServer is not running; refusing to skip the macOS root-shell launch smoke"
            exit 1
          fi
          console_uid="$(stat -f %u /dev/console)"
          current_uid="$(id -u)"
          if [[ -z "$console_uid" || "$console_uid" != "$current_uid" ]]; then
            echo "::error::Runner user $current_uid does not own the macOS GUI console session ($console_uid)"
            exit 1
          fi
      - name: Build macOS app shell
        working-directory: candidate-clients
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/xcode-derived-data
          SWIFT_PACKAGE_CLONES: ${{ runner.temp }}/swift-package-clones
        run: |
          rm -rf "$XCODE_DERIVED_DATA" "$SWIFT_PACKAGE_CLONES"
          ./swift-clients/tooling/generate.sh macOS
          xcodebuild -project swift-clients/apps/macOS/Voucha.xcodeproj -scheme Voucha -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -disablePackageRepositoryCache -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" -derivedDataPath "$XCODE_DERIVED_DATA" -destination 'platform=macOS' build SYMROOT="$XCODE_DERIVED_DATA/Build/Products" OBJROOT="$XCODE_DERIVED_DATA/Build/Intermediates.noindex" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Launch macOS root shell
        timeout-minutes: 15
        working-directory: candidate-clients
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/xcode-derived-data
          SWIFT_PACKAGE_CLONES: ${{ runner.temp }}/swift-package-clones
        run: |
          destinations="$(xcodebuild -project swift-clients/apps/macOS/Voucha.xcodeproj -scheme Voucha -showdestinations -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -disablePackageRepositoryCache -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" -derivedDataPath "$XCODE_DERIVED_DATA" 2>&1)"
          if ! printf '%s\n' "$destinations" | grep -q 'platform:macOS'; then
            echo "::error::Selected Xcode has no macOS test destination for the root-shell launch smoke"
            printf '%s\n' "$destinations"
            exit 1
          fi
          rm -rf "$XCODE_DERIVED_DATA/Build/Products/Debug/Voucha.app"
          xcodebuild -project swift-clients/apps/macOS/Voucha.xcodeproj -scheme Voucha -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -disablePackageRepositoryCache -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" -derivedDataPath "$XCODE_DERIVED_DATA" -destination 'platform=macOS' -parallel-testing-enabled NO -only-testing:VouchaLaunchSmokeTests/LaunchSmokeTests/testLaunchRendersRootShell -resultBundlePath "$RUNNER_TEMP/macos-launch-smoke.xcresult" test SYMROOT="$XCODE_DERIVED_DATA/Build/Products" OBJROOT="$XCODE_DERIVED_DATA/Build/Intermediates.noindex" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS="$PWD/swift-clients/apps/macOS/VouchaLaunchSmoke.entitlements"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/macos-launch-smoke.xcresult" | jq -e '.totalTestCount == 1 and .passedTests == 1 and .failedTests == 0 and .skippedTests == 0'
      - name: Collect failed macOS launch diagnostics
        if: ${{ failure() }}
        timeout-minutes: 2
        continue-on-error: true
        run: |
          diagnostics="$RUNNER_TEMP/macos-launch-diagnostics"
          mkdir -p "$diagnostics"
          log show --last 5m --style compact --predicate 'process == "Voucha"' > "$diagnostics/launch.log" 2>&1 || true
          reports_dir="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$reports_dir" ]; then
            find "$reports_dir" -maxdepth 1 \( -name 'Voucha*.ips' -o -name 'Voucha*.crash' \) -mmin -15 -exec cp {} "$diagnostics"/ \; || true
          fi
      - name: Upload failed macOS launch diagnostics
        if: ${{ failure() }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: macos-launch-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-launch-smoke.xcresult
            ${{ runner.temp }}/macos-launch-diagnostics
          retention-days: 1
          if-no-files-found: warn
  build-ios-tests:
    name: Swift iOS Simulator build for testing
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 9
    permissions:
      actions: read
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Verify pinned Xcode
        run: test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = 26.6
      - name: Install pinned XcodeGen
        timeout-minutes: 5
        working-directory: candidate-clients
        run: |
          xcodegen_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 2 --retry-max-time 120 --retry-all-errors --silent --show-error "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" --output "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip" -d "$xcodegen_root"
          xcodegen_bin="$xcodegen_root/xcodegen/bin/xcodegen"
          test -x "$xcodegen_bin"
          test "$("$xcodegen_bin" --version)" = "Version: ${XCODEGEN_VERSION}"
          dirname "$xcodegen_bin" >> "$GITHUB_PATH"
      - name: Build selected iPhone test products
        timeout-minutes: 7
        working-directory: candidate-clients
        env:
          XCODE_DERIVED_DATA: ${{ github.workspace }}/ios-test-derived-data
          SWIFT_PACKAGE_CLONES: ${{ runner.temp }}/swift-ios-package-clones
        run: |
          set -euo pipefail
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime_identifier="com.apple.CoreSimulator.SimRuntime.iOS-${simulator_sdk//./-}"
          simulator_name="$(xcrun simctl list devices available -j | jq -r --arg runtime "$runtime_identifier" '[.devices[$runtime][]? | select(.isAvailable and (.name | startswith("iPhone "))) | .name][0] // empty')"
          if [[ -z "$simulator_name" ]]; then
            echo "::error::Pinned Xcode has no available iPhone Simulator for $runtime_identifier launch smoke"
            exit 1
          fi
          ./swift-clients/tooling/generate.sh iOS
          destination="platform=iOS Simulator,name=$simulator_name,OS=$simulator_sdk,arch=arm64"
          test ! -e "$GITHUB_WORKSPACE/Voucha.xctestproducts"
          test ! -L "$GITHUB_WORKSPACE/Voucha.xctestproducts"
          xcodebuild -project swift-clients/apps/iOS/Voucha.xcodeproj -scheme Voucha -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -disablePackageRepositoryCache -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" -derivedDataPath "$XCODE_DERIVED_DATA" -destination "$destination" -parallel-testing-enabled NO -only-testing:VouchaLaunchSmokeTests/LaunchSmokeTests/testLaunchRendersRootShell -only-testing:VouchaLaunchSmokeTests/FeedFlowTests/testVideoFeedLoadsCanonicalRowAndSurvivesTabNavigation -testProductsPath "$GITHUB_WORKSPACE/Voucha.xctestproducts" build-for-testing VOUCHA_FILAMENTS_CONTRACT_ROOT="$VOUCHA_FILAMENTS_CONTRACT_ROOT" SYMROOT="$XCODE_DERIVED_DATA/Build/Products" OBJROOT="$XCODE_DERIVED_DATA/Build/Intermediates.noindex" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          bundle="$GITHUB_WORKSPACE/Voucha.xctestproducts"
          test -f "$bundle/Info.plist"
          app="$(find "$bundle" -type d -name Voucha.app -print -quit)"
          runner="$(find "$bundle" -type d -name VouchaLaunchSmokeTests-Runner.app -print -quit)"
          test_bundle="$(find "$bundle" -type d -name VouchaLaunchSmokeTests.xctest -print -quit)"
          test "$(find "$bundle" -type d -name Voucha.app | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle" -type d -name VouchaLaunchSmokeTests-Runner.app | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle" -type d -name VouchaLaunchSmokeTests.xctest | wc -l | tr -d ' ')" -eq 1
          jq -n --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg revision "$(git rev-parse HEAD)" --arg xcode "$(xcodebuild -version | tr '\n' ' ')" --arg sdk "$simulator_sdk" --arg destination "$destination" --arg bundle "$bundle" --arg app "$app" --arg runner "$runner" --arg testBundle "$test_bundle" '{run:$run,attempt:$attempt,revision:$revision,xcode:$xcode,sdk:$sdk,destination:$destination,bundle:$bundle,app:$app,runner:$runner,testBundle:$testBundle}' > "$GITHUB_WORKSPACE/ios-test-manifest.json"
      - name: Package iOS test products
        timeout-minutes: 3
        run: |
          set -euo pipefail
          COPYFILE_DISABLE=1 tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/ios-test-products.tar.gz" Voucha.xctestproducts
          python3 "$GITHUB_WORKSPACE/scripts/verify-ios-test-tar.py" "$RUNNER_TEMP/ios-test-products.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/ios-test-products.tar.gz" | awk '{print $1}' > "$RUNNER_TEMP/ios-test-products.sha256"
          cp "$GITHUB_WORKSPACE/ios-test-manifest.json" "$RUNNER_TEMP/ios-test-manifest.json"
      - name: Upload iOS test products
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: ios-test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-test-products.tar.gz
            ${{ runner.temp }}/ios-test-products.sha256
            ${{ runner.temp }}/ios-test-manifest.json
          if-no-files-found: error
          retention-days: 1

