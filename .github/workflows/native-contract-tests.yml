name: Native contract tests
run-name: Native contract tests for producer ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [Native contract producer]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: native-contract-tests-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify native contract handoff
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    outputs:
      base-sha: ${{ steps.identity.outputs.base_sha }}
      merge-sha: ${{ steps.identity.outputs.merge_sha }}
    steps:
      - name: Clean persistent runner workspace
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace
      - name: Check out trusted consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Download exact producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: native-contract-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/native-contract
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify artifact bytes and producer identity
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/native-contract
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          node scripts/contract-artifact.mjs verify
          --artifact-root "$ARTIFACT_ROOT"
          --expected-clients-repository "$GITHUB_REPOSITORY"
          --expected-producer-run-id "$PRODUCER_RUN_ID"
          --expected-producer-run-attempt "$PRODUCER_RUN_ATTEMPT"
      - name: Validate live pull request identity
        id: identity
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/native-contract
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const manifest = JSON.parse(readFileSync(`${process.env.ARTIFACT_ROOT}/manifest.json`, 'utf8'))
          const pr = JSON.parse(execFileSync('gh', [
            'api',
            `repos/${manifest.clientsRepository}/pulls/${manifest.pullRequest.number}`,
          ], { encoding: 'utf8' }))
          if (pr.state !== 'open') throw new Error(`pull request is ${pr.state}`)
          if (pr.base.sha !== manifest.pullRequest.base) throw new Error('pull request base SHA changed')
          if (pr.head.sha !== manifest.pullRequest.head) throw new Error('pull request head SHA changed')

          const mergeSha = JSON.parse(execFileSync('gh', [
            'api',
            `repos/${manifest.clientsRepository}/git/ref/pull/${manifest.pullRequest.number}/merge`,
          ], { encoding: 'utf8' })).object.sha
          if (mergeSha !== manifest.pullRequest.merge) throw new Error('pull request merge SHA changed')

          appendFileSync(process.env.GITHUB_OUTPUT, `base_sha=${manifest.pullRequest.base}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `merge_sha=${mergeSha}\n`)
          NODE
      - name: Check out exact candidate merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.merge_sha }}
          path: candidate-clients
          persist-credentials: false
      - name: Assert candidate against verified artifact
        env:
          VOUCHA_FILAMENTS_CONTRACT_ROOT: ${{ runner.temp }}/native-contract
        run: >-
          node candidate-clients/scripts/contracts.mjs check
          --destination-root "${{ github.workspace }}/candidate-clients"
      - name: Clean persistent runner workspace
        if: always()
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  dotnet-portable:
    name: .NET portable (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, Linux, Docker, Tests]
          - os: macos
            runner: [self-hosted, macOS, Tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MSBuildEnableWorkloadResolver: "false"
    steps:
      - name: Check out trusted consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Prepare verified candidate
        uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - name: Read exact .NET SDK version
        id: dotnet-sdk
        working-directory: candidate-clients
        run: |
          set -euo pipefail
          sdk_version="$(jq -er '.sdk.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' global.json)" || {
            echo "global.json must define a numeric sdk.version"
            exit 1
          }
          printf 'version=%s\n' "$sdk_version" >> "$GITHUB_OUTPUT"
      - name: Reset exact .NET SDK root
        run: |
          set -euo pipefail
          [[ "$DOTNET_INSTALL_DIR" == "$RUNNER_TEMP/voucha-dotnet-sdk" ]]
          rm -rf -- "$DOTNET_INSTALL_DIR"
          mkdir -p -- "$DOTNET_INSTALL_DIR"
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - name: Restore, format, analyze, validate RESX, and build
        working-directory: candidate-clients
        run: ./dotnet-clients/tooling/harness.sh
      - name: Test portable solution with coverage
        working-directory: candidate-clients
        run: >-
          ./dotnet-clients/tooling/harness.sh --exec
          dotnet test Voucha.DotNet.sln
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/core --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=lcov
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile=**/obj/**"
      - name: Normalize Core coverage report
        if: matrix.os == 'linux'
        working-directory: candidate-clients/dotnet-clients
        run: |
          set -euo pipefail
          reports="$(find TestResults/core -type f -name coverage.info -print)"
          [ "$(printf '%s\n' "$reports" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ] || {
            echo '::error::Expected exactly one coverage.info under TestResults/core.'
            exit 1
          }
          cp "$reports" TestResults/core/lcov.info
      - name: Enforce Core patch coverage
        if: matrix.os == 'linux'
        working-directory: candidate-clients
        env:
          COVERAGE_BASE: ${{ needs.verify.outputs.base-sha }}
          COVERAGE_HEAD: ${{ needs.verify.outputs.merge-sha }}
        run: pnpm run coverage:dotnet-core
      - name: Clean persistent runner workspace
        if: always()
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  lint-swift:
    name: Swift lint
    needs: verify
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - uses: ./.github/actions/setup-swift-native
        with:
          tools: lint
      - name: Check Swift formatting and lint
        working-directory: candidate-clients
        run: |
          mise exec github:nicklockwood/SwiftFormat@0.61.1 -- swiftformat --lint swift-clients/
          mise exec aqua:realm/SwiftLint@0.65.0 -- bash -c "cd swift-clients && swiftlint --strict --cache-path '$RUNNER_TEMP/swiftlint'"
          mise exec aqua:realm/SwiftLint@0.65.0 -- bash -c "cd swift-clients && swiftlint --strict --config .swiftlint-tests.yml --cache-path '$RUNNER_TEMP/swiftlint-tests'"
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  periphery-swift-core:
    name: Swift Periphery (core)
    needs: verify
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: false, persist-credentials: false }
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - uses: ./.github/actions/setup-swift-native
        with: { tools: periphery }
      - name: Find unused declarations in core
        working-directory: candidate-clients
        run: >-
          bash swift-clients/tooling/with-build-lock.sh mise exec aqua:peripheryapp/periphery@3.7.4 --
          bash -c 'cd swift-clients/core && periphery scan --strict -- --force-resolved-versions --disable-dependency-cache'
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  periphery-swift-ui:
    name: Swift Periphery (UI)
    needs: verify
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: false, persist-credentials: false }
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - uses: ./.github/actions/setup-swift-native
        with: { tools: periphery }
      - name: Find unused declarations in UI
        working-directory: candidate-clients
        run: >-
          bash swift-clients/tooling/with-build-lock.sh mise exec aqua:peripheryapp/periphery@3.7.4 --
          bash -c 'cd swift-clients/ui && periphery scan --strict -- --force-resolved-versions --disable-dependency-cache'
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  test-swift-core:
    name: Swift core tests and Android Skip
    needs: verify
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 34
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: false, persist-credentials: false }
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - name: Test core package with coverage
        working-directory: candidate-clients
        run: >-
          bash swift-clients/tooling/with-build-lock.sh swift test --package-path swift-clients/core
          --force-resolved-versions --disable-dependency-cache --enable-code-coverage
      - name: Resolve Java for Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          if java -version >/dev/null 2>&1; then
            java_home="$({ java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/^[[:space:]]*java\.home[[:space:]]*=/ { print $2; exit }'; })"
          elif command -v brew >/dev/null 2>&1; then
            java_home="$(brew --prefix openjdk)/libexec/openjdk.jdk/Contents/Home"
          else
            echo '::error::Java is unavailable and Homebrew OpenJDK cannot be located.' >&2; exit 1
          fi
          [[ -n "$java_home" && -x "$java_home/bin/java" ]]
          "$java_home/bin/java" -version
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      - name: Select job-scoped Android SDK location
        shell: bash
        run: |
          android_sdk="$RUNNER_TEMP/android-sdk"
          rm -rf -- "$android_sdk"
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Provision pinned job-scoped Swiftly
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          swiftly_version="1.1.3"
          swiftly_sha256="fade009739a84f18ee30e524793f927019fc9c2e16b2ad958da50d3f9ff7a7f8"
          swiftly_cache_dir="$HOME/.cache/voucha/swift-android/downloads"; mkdir -p -- "$swiftly_cache_dir"
          swiftly_archive="$swiftly_cache_dir/swiftly-$swiftly_version.pkg"
          swiftly_root="$RUNNER_TEMP/swiftly-$swiftly_version"; rm -rf -- "$swiftly_root"; mkdir -p -- "$swiftly_root"
          swiftly_expanded="$swiftly_root/expanded"; swiftly_bin_dir="$swiftly_root/bin"; skip_swift_home="$RUNNER_TEMP/skip-swift-home"
          rm -rf -- "$skip_swift_home"; mkdir -p -- "$skip_swift_home"
          if [[ ! -f "$swiftly_archive" ]] || ! printf '%s  %s\n' "$swiftly_sha256" "$swiftly_archive" | shasum -a 256 -c -; then
            rm -f -- "$swiftly_archive"
            curl --fail --location --retry 2 --retry-all-errors --silent --show-error "https://download.swift.org/swiftly/darwin/swiftly-$swiftly_version.pkg" --output "$swiftly_archive"
            printf '%s  %s\n' "$swiftly_sha256" "$swiftly_archive" | shasum -a 256 -c -
          fi
          pkgutil --check-signature "$swiftly_archive" 2>&1 | tee "$swiftly_root/signature.txt"
          grep -Fq 'Developer ID Installer: Swift Open Source (V9AUD2URP3)' "$swiftly_root/signature.txt"
          pkgutil --expand-full "$swiftly_archive" "$swiftly_expanded"
          swiftly_source="$swiftly_expanded/swiftly-$swiftly_version.pkg/Payload/bin/swiftly"; test -x "$swiftly_source"
          mkdir -p -- "$swiftly_bin_dir"; cp "$swiftly_source" "$swiftly_bin_dir/swiftly"; chmod 0755 "$swiftly_bin_dir/swiftly"
          export SWIFTLY_HOME_DIR="$skip_swift_home/.swiftly"; export SWIFTLY_BIN_DIR="$swiftly_bin_dir"; export SWIFTLY_TOOLCHAINS_DIR="$skip_swift_home/toolchains"
          "$swiftly_bin_dir/swiftly" init --no-modify-profile --skip-install --quiet-shell-followup --assume-yes
          [[ "$("$swiftly_bin_dir/swiftly" --version)" == "$swiftly_version" ]]
          { echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR"; echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR"; echo "SWIFTLY_TOOLCHAINS_DIR=$SWIFTLY_TOOLCHAINS_DIR"; } >> "$GITHUB_ENV"
          echo "$swiftly_bin_dir" >> "$GITHUB_PATH"
      - name: Remove obsolete Swift Android executable cache
        run: |
          cache_root="$HOME/.cache/voucha/swift-android"
          for cache_path in "$HOME/.cache" "$HOME/.cache/voucha" "$cache_root"; do
            [[ ! -L "$cache_path" && ( ! -e "$cache_path" || -d "$cache_path" ) ]] || { echo "unsafe Swift Android cache path: $cache_path" >&2; exit 1; }
          done
          rm -rf -- "$cache_root/extracted"
      - name: Prefetch and materialize Skip Swift Android SDK
        working-directory: candidate-clients
        timeout-minutes: 12
        run: |
          export VOUCHA_SWIFT_ANDROID_DOWNLOAD_DIR="$HOME/.cache/voucha/swift-android/downloads"
          export VOUCHA_SKIP_SWIFT_HOME="$RUNNER_TEMP/skip-swift-home"
          bash swift-clients/apps/android/tooling/materialize-skip-sdk.sh
      - name: Resolve Android Swift package with shared artifact cache
        working-directory: candidate-clients
        run: |
          resolve_log="$RUNNER_TEMP/android-swift-resolve.log"
          swift package resolve --package-path swift-clients/apps/android --force-resolved-versions --disable-keychain --disable-netrc 2>&1 | tee "$resolve_log"
          ! grep -E 'Downloading binary artifact' "$resolve_log"
      - name: Test Android Swift package
        working-directory: candidate-clients
        run: >-
          bash swift-clients/tooling/with-build-lock.sh swift test --package-path swift-clients/apps/android
          --force-resolved-versions --disable-dependency-cache --disable-keychain --disable-netrc
      - name: Build and test Android application without a device
        working-directory: candidate-clients
        env:
          VOUCHA_SKIP_SWIFT_HOME: ${{ runner.temp }}/skip-swift-home
          VOUCHA_BUILD_LOCK_COMMAND_TIMEOUT_SECONDS: 600
          VOUCHA_SKIP_ANDROID_HOST_SWIFT_TEST: "1"
        run: |
          export VOUCHA_SWIFT_ANDROID_DOWNLOAD_DIR="$HOME/.cache/voucha/swift-android/downloads"
          bash swift-clients/tooling/with-build-lock.sh bash swift-clients/apps/android/tooling/pre-push.sh
      - name: Export deterministic core LCOV
        working-directory: candidate-clients
        run: bash swift-clients/tooling/write-lcov.sh swift-clients/core VouchaCorePackageTests coverage/core/lcov.info
      - name: Upload core LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: swift-core-lcov-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: candidate-clients/coverage/core/lcov.info
          retention-days: 1
          if-no-files-found: error
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  test-swift-ui:
    name: Swift UI tests and coverage
    needs: verify
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 22
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: false, persist-credentials: false }
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - name: Record swift test start marker
        run: |
          mkdir -p "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/swift-ui-test-start-marker"
      - name: Test UI package with coverage
        working-directory: candidate-clients
        run: >-
          bash swift-clients/tooling/with-build-lock.sh swift test --package-path swift-clients/ui
          --force-resolved-versions --disable-dependency-cache --enable-code-coverage
      - name: Collect xctest crash reports
        if: ${{ failure() }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -euo pipefail
          collected="$RUNNER_TEMP/swift-ui-crash-reports"; mkdir -p "$collected"
          reports_dir="$HOME/Library/Logs/DiagnosticReports"; marker="$RUNNER_TEMP/swift-ui-test-start-marker"
          attempt=1
          while [ "$attempt" -le 6 ]; do
            if [ -d "$reports_dir" ]; then
              # shellcheck disable=SC2016
              find "$reports_dir" \( -name '*.ips' -o -name '*.crash' \) -newer "$marker" -print0 2>/dev/null | xargs -0 -I{} sh -c 'grep -q "VouchaUIPackageTests" "$1" 2>/dev/null && cp "$1" "$2" || true' _ {} "$collected"
            fi
            [ -z "$(ls -A "$collected" 2>/dev/null)" ] || break
            attempt=$((attempt + 1)); sleep 5
          done
      - name: Upload xctest crash reports
        if: ${{ failure() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          overwrite: true
          name: swift-ui-crash-reports-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/swift-ui-crash-reports
          retention-days: 1
          if-no-files-found: ignore
      - name: Export deterministic UI LCOV
        working-directory: candidate-clients
        run: bash swift-clients/tooling/write-lcov.sh swift-clients/ui VouchaUIPackageTests coverage/ui/lcov.info
      - name: Upload UI LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: swift-ui-lcov-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: candidate-clients/coverage/ui/lcov.info
          retention-days: 1
          if-no-files-found: error
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  swift-patch-coverage:
    name: Swift patch coverage
    needs: [verify, test-swift-core, test-swift-ui]
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: false, persist-credentials: false }
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - name: Download Core LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: swift-core-lcov-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: candidate-clients/coverage/core
      - name: Download UI LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: swift-ui-lcov-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: candidate-clients/coverage/ui
      - name: Enforce 90% Swift patch coverage
        working-directory: candidate-clients
        env: { BASE_SHA: "${{ needs.verify.outputs.base-sha }}" }
        run: pnpm run coverage:swift
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  build-android-core:
    name: Swift Android core build
    needs: verify
    runs-on: [self-hosted, Linux, Docker, Tests]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: false, persist-credentials: false }
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - name: Prefetch Swift Android SDK and NDK archives
        working-directory: candidate-clients
        run: |
          export VOUCHA_SWIFT_ANDROID_DOWNLOAD_DIR="$HOME/.cache/voucha/swift-android/downloads"
          bash swift-clients/tooling/build-android-core.sh --fetch
      - name: Build Android core package
        working-directory: candidate-clients
        run: >-
          bash swift-clients/tooling/with-build-lock.sh docker run --rm
          --volume "$PWD:/workspace" --tmpfs /tmp:rw,exec,mode=1777
          --volume "$HOME/.cache/voucha/swift-android/downloads:/opt/swift-android-downloads:ro"
          --workdir /workspace --env HOME=/root --env RUNNER_TEMP=/tmp --env TMPDIR=/tmp
          --env VOUCHA_SWIFT_ANDROID_DOWNLOAD_DIR=/opt/swift-android-downloads --env VOUCHA_SWIFT_ANDROID_OFFLINE=1
          swift:6.3.3-noble@sha256:66520bcba471018a34fd54ba09be97ba4abebd950a96ff5cb8c2bf50a2d33259
          /bin/bash -c 'bash swift-clients/tooling/build-android-core.sh'
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  build-macos-app:
    name: Swift macOS app smoke
    needs: verify
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { clean: false, persist-credentials: false }
      - uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - name: Install pinned XcodeGen
        working-directory: candidate-clients
        run: |
          xcodegen_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" --output "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip" -d "$xcodegen_root"
          xcodegen_bin="$xcodegen_root/xcodegen/bin/xcodegen"
          test -x "$xcodegen_bin"
          test "$("$xcodegen_bin" --version)" = "Version: ${XCODEGEN_VERSION}"
          dirname "$xcodegen_bin" >> "$GITHUB_PATH"
      - name: Build macOS app shell
        working-directory: candidate-clients
        env:
          XCODE_DERIVED_DATA: ${{ runner.temp }}/xcode-derived-data
          SWIFT_PACKAGE_CLONES: ${{ runner.temp }}/swift-package-clones
        run: |
          rm -rf "$XCODE_DERIVED_DATA" "$SWIFT_PACKAGE_CLONES"
          ./swift-clients/tooling/generate.sh macOS
          bash swift-clients/tooling/with-build-lock.sh xcodebuild -project swift-clients/apps/macOS/Voucha.xcodeproj -scheme Voucha -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -disablePackageRepositoryCache -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" -derivedDataPath "$XCODE_DERIVED_DATA" -destination 'platform=macOS' build SYMROOT="$XCODE_DERIVED_DATA/Build/Products" OBJROOT="$XCODE_DERIVED_DATA/Build/Intermediates.noindex" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Clean persistent runner workspace
        if: always()
        env: { PRESERVE_NODE_MODULES: "false" }
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace

  # iOS simulator smoke remains disabled pending #6705: the self-hosted runner's
  # CoreSimulator framework is incompatible with its installed Xcode, so no iOS
  # Simulator destination resolves. Do not replace this with a no-op green job.

  dotnet-maui:
    name: .NET MAUI Mac Catalyst
    needs: verify
    runs-on: [self-hosted, macOS, Tests]
    timeout-minutes: 40
    env:
      UseArtifactsOutput: "true"
    steps:
      - name: Check out trusted consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Prepare verified candidate
        uses: ./.github/actions/prepare-native-contract
        with:
          candidate-merge-sha: ${{ needs.verify.outputs.merge-sha }}
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          producer-run-id: ${{ github.event.workflow_run.id }}
      - name: Configure isolated MAUI paths
        shell: bash
        run: |
          {
            echo "ArtifactsPath=$RUNNER_TEMP/voucha-dotnet-lock-artifacts/app-tests"
            echo "VOUCHA_DOTNET_LOCK_ARTIFACTS_ROOT=$RUNNER_TEMP/voucha-dotnet-lock-artifacts"
            echo "VOUCHA_DOTNET_LOCK_SCRATCH_ROOT=$RUNNER_TEMP/voucha-dotnet-lock-scratch"
          } >>"$GITHUB_ENV"
      - name: Read exact .NET SDK version
        id: dotnet-sdk
        working-directory: candidate-clients
        run: |
          set -euo pipefail
          sdk_version="$(jq -er '.sdk.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' global.json)" || {
            echo "global.json must define a numeric sdk.version"
            exit 1
          }
          printf 'version=%s\n' "$sdk_version" >> "$GITHUB_OUTPUT"
      - name: Reset exact .NET SDK root
        run: |
          set -euo pipefail
          [[ "$DOTNET_INSTALL_DIR" == "$RUNNER_TEMP/voucha-dotnet-sdk" ]]
          rm -rf -- "$DOTNET_INSTALL_DIR"
          mkdir -p -- "$DOTNET_INSTALL_DIR"
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - name: Detect pinned MAUI workload
        id: workload
        working-directory: candidate-clients
        run: |
          set -euo pipefail
          expected=$(jq -r '.sdk.workloadVersion' global.json)
          installed=$(dotnet workload --version 2>/dev/null || true)
          if [ "$installed" = "$expected" ] && dotnet workload list | awk '$1 == "maui-maccatalyst" { found = 1 } END { exit !found }'; then
            echo 'install=false' >>"$GITHUB_OUTPUT"
          else
            echo 'install=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Install pinned MAUI workload under host lock
        if: steps.workload.outputs.install == 'true'
        working-directory: candidate-clients
        run: >-
          pnpm exec vouchington with-host-lock
          --name host-package-manager
          --timeout-seconds 300
          --command-timeout-seconds 720
          -- dotnet workload install maui-maccatalyst
          --configfile dotnet-clients/NuGet.config
      - name: Verify all seven committed NuGet locks
        working-directory: candidate-clients
        run: >-
          pnpm exec vouchington with-host-lock
          --name host-package-manager
          --timeout-seconds 300
          --command-timeout-seconds 900
          -- bash dotnet-clients/tooling/restore-locks.sh verify
      - name: Build rendered MAUI page tests
        working-directory: candidate-clients
        run: >-
          ./dotnet-clients/tooling/with-build-lock.sh
          dotnet build dotnet-clients/tests/Voucha.Client.App.Tests/Voucha.Client.App.Tests.csproj
          --configuration Release --no-restore
      - name: Test rendered MAUI pages
        working-directory: candidate-clients
        run: >-
          dotnet test dotnet-clients/tests/Voucha.Client.App.Tests/Voucha.Client.App.Tests.csproj
          --configuration Release --no-build
      - name: Select compatible Xcode
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          required_version=26.5
          selected=$(xcode-select -p 2>/dev/null || true)
          shopt -s nullglob
          candidates=("$selected" /Applications/Xcode*.app/Contents/Developer)
          for developer_dir in "${candidates[@]}"; do
            [ -d "$developer_dir" ] || continue
            version=$(DEVELOPER_DIR="$developer_dir" xcodebuild -version 2>/dev/null | awk 'NR == 1 { print $2 }')
            if [[ "$version" == "$required_version"* ]]; then
              echo "DEVELOPER_DIR=$developer_dir" >>"$GITHUB_ENV"
              echo 'compatible=true' >>"$GITHUB_OUTPUT"
              echo "Selected Xcode $version at $developer_dir"
              exit 0
            fi
            echo "Skipping $developer_dir because it is Xcode ${version:-unknown}, not $required_version"
          done
          echo "::notice::Xcode $required_version not found; skipping MAUI Mac Catalyst smoke build on this runner"
          echo 'compatible=false' >>"$GITHUB_OUTPUT"
      - name: Detect host Mac Catalyst RID
        id: rid
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) rid=maccatalyst-arm64 ;;
            x86_64) rid=maccatalyst-x64 ;;
            *) echo "Unsupported macOS architecture: $(uname -m)"; exit 1 ;;
          esac
          echo "runtime_identifier=$rid" >>"$GITHUB_OUTPUT"
      - name: Build MAUI Mac Catalyst app
        if: steps.xcode.outputs.compatible == 'true'
        working-directory: candidate-clients
        env:
          ArtifactsPath: ${{ env.VOUCHA_DOTNET_LOCK_ARTIFACTS_ROOT }}/app-${{ steps.rid.outputs.runtime_identifier }}
        run: >-
          ./dotnet-clients/tooling/with-build-lock.sh
          dotnet build dotnet-clients/src/Voucha.Client.App/Voucha.Client.App.csproj
          --configuration Release --framework net10.0-maccatalyst
          "-p:RuntimeIdentifier=${{ steps.rid.outputs.runtime_identifier }}"
          --no-restore
      - name: Clean persistent runner workspace
        if: always()
        env:
          PRESERVE_NODE_MODULES: "false"
        run: pnpm dlx vouchington-tooling@0.1.5 clean-workspace
