        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: ios-test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-test-artifact
      - name: Verify and unpack iOS test products
        timeout-minutes: 3
        env:
          EXPECTED_REVISION: ${{ needs.verify.outputs.revision-sha }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/ios-test-artifact"
          manifest="$artifact/ios-test-manifest.json"
          test "$(jq -r '.run' "$manifest")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.attempt' "$manifest")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r '.revision' "$manifest")" = "$EXPECTED_REVISION"
          test "$(jq -r '.revision' "$manifest")" = "$(git -C candidate-clients rev-parse HEAD)"
          test "$(jq -r '.xcode' "$manifest")" = "$(xcodebuild -version | tr '\n' ' ')"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          test "$(jq -r '.sdk' "$manifest")" = "$simulator_sdk"
          bundle="$GITHUB_WORKSPACE/Voucha.xctestproducts"
          test "$(jq -r '.bundle' "$manifest")" = "$bundle"
          test ! -e "$bundle"
          test ! -L "$bundle"
          for product in app runner testBundle; do
            path="$(jq -r --arg product "$product" '.[$product]' "$manifest")"
            case "$path" in
              "$bundle"/*) ;;
              *) echo "::error::Invalid $product path in iOS test manifest" >&2; exit 1 ;;
            esac
            case "$path" in
              */../*|*/./*) echo "::error::Non-canonical $product path in iOS test manifest" >&2; exit 1 ;;
            esac
          done
          destination="$(jq -r '.destination' "$manifest")"
          simulator_name="${destination#*name=}"
          simulator_name="${simulator_name%%,OS=*}"
          test "$destination" = "platform=iOS Simulator,name=$simulator_name,OS=$simulator_sdk,arch=arm64"
          runtime_identifier="com.apple.CoreSimulator.SimRuntime.iOS-${simulator_sdk//./-}"
          simulator_id="$(xcrun simctl list devices available -j | jq -r --arg runtime "$runtime_identifier" '[.devices[$runtime][]? | select(.isAvailable and (.name | startswith("iPad "))) | .udid][0] // empty')"
          if [[ -z "$simulator_id" ]]; then
            echo "::error::Pinned Xcode has no available iPad Simulator for $runtime_identifier root-shell launch"
            exit 1
          fi
          ipad_name="$(xcrun simctl list devices available -j | jq -r --arg udid "$simulator_id" '[.devices[][] | select(.udid == $udid) | .name][0] // empty')"
          if [[ "$ipad_name" != iPad\ * ]]; then
            echo "::error::Selected simulator is not an iPad: $ipad_name" >&2
            exit 1
          fi
          printf '%s\n' "$simulator_id" > "$RUNNER_TEMP/ipad-launch-simulator-id"
          printf '%s\n' "$ipad_name" > "$RUNNER_TEMP/ipad-launch-simulator-name"
          printf '%s\n' "platform=iOS Simulator,name=$ipad_name,OS=$simulator_sdk,arch=arm64" > "$RUNNER_TEMP/ipad-launch-destination"
          printf '%s\n' "$bundle" > "$RUNNER_TEMP/ipad-launch-test-products"
          cd "$artifact"
          printf '%s  %s\n' "$(cat ios-test-products.sha256)" ios-test-products.tar.gz | shasum -a 256 -c -
          python3 "$GITHUB_WORKSPACE/scripts/verify-ios-test-tar.py" ios-test-products.tar.gz
          tar -C "$GITHUB_WORKSPACE" -xzf ios-test-products.tar.gz
          test -f "$bundle/Info.plist"
          for product in app runner testBundle; do
            path="$(jq -r --arg product "$product" '.[$product]' "$manifest")"
            test -d "$path"
          done
          test "$(find "$bundle" -type d -name Voucha.app | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle" -type d -name VouchaLaunchSmokeTests-Runner.app | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle" -type d -name VouchaLaunchSmokeTests.xctest | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle" -type d -name Voucha.app -print -quit)" = "$(jq -r '.app' "$manifest")"
          test "$(find "$bundle" -type d -name VouchaLaunchSmokeTests-Runner.app -print -quit)" = "$(jq -r '.runner' "$manifest")"
          test "$(find "$bundle" -type d -name VouchaLaunchSmokeTests.xctest -print -quit)" = "$(jq -r '.testBundle' "$manifest")"
      - name: Start iPad Simulator for root-shell launch
        timeout-minutes: 3
        working-directory: candidate-clients
        run: |
          simulator_id="$(cat "$RUNNER_TEMP/ipad-launch-simulator-id")"
          simulator_state="$(xcrun simctl list devices available -j | jq -r --arg udid "$simulator_id" '[.devices[][] | select(.udid == $udid) | .state][0] // empty')"
          case "$simulator_state" in
            Shutdown) xcrun simctl boot "$simulator_id" ;;
            Booted) ;;
            *) echo "::error::iPad Simulator is not bootable: $simulator_state" >&2; exit 1 ;;
          esac
      - name: Wait for iPad Simulator readiness
        timeout-minutes: 4
        working-directory: candidate-clients
        run: |
          simulator_id="$(cat "$RUNNER_TEMP/ipad-launch-simulator-id")"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Launch iPad root shell on Simulator
        timeout-minutes: 7
        working-directory: candidate-clients
        run: |
          bundle="$(cat "$RUNNER_TEMP/ipad-launch-test-products")"
          destination="$(cat "$RUNNER_TEMP/ipad-launch-destination")"
          xcodebuild -testProductsPath "$bundle" -destination "$destination" -destination-timeout 120 -parallel-testing-enabled NO -only-testing:VouchaLaunchSmokeTests/LaunchSmokeTests/testLaunchRendersRootShell -resultBundlePath "$RUNNER_TEMP/ipad-launch-smoke.xcresult" test-without-building VOUCHA_FILAMENTS_CONTRACT_ROOT="$VOUCHA_FILAMENTS_CONTRACT_ROOT" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ipad-launch-smoke.xcresult" | jq -e '.totalTestCount == 1 and .passedTests == 1 and .failedTests == 0 and .skippedTests == 0'
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### iPad root-shell launch"
              echo
              echo "Simulator: $(cat "$RUNNER_TEMP/ipad-launch-simulator-name")"
              echo
              echo "Accepted one passed test and zero skipped tests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect failed iPad launch diagnostics
        if: ${{ failure() }}
        timeout-minutes: 2
        continue-on-error: true
        run: |
          diagnostics="$RUNNER_TEMP/ipad-launch-diagnostics"
          mkdir -p "$diagnostics"
          xcrun simctl list devices available -j > "$diagnostics/simulators.json" || true
          if [ -f "$RUNNER_TEMP/ipad-launch-simulator-id" ]; then
            simulator_id="$(cat "$RUNNER_TEMP/ipad-launch-simulator-id")"
            xcrun simctl spawn "$simulator_id" log show --last 5m --style compact --predicate 'process == "Voucha" OR (process == "SpringBoard" AND eventMessage CONTAINS[c] "ai.voucha.ios")' > "$diagnostics/launch.log" 2>&1 || true
          fi
          reports_dir="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$reports_dir" ]; then
            find "$reports_dir" -maxdepth 1 \( -name 'Voucha*.ips' -o -name 'Voucha*.crash' \) -mmin -15 -exec cp {} "$diagnostics"/ \; || true
          fi
      - name: Upload failed iPad launch diagnostics
        if: ${{ failure() }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: ipad-launch-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ipad-launch-smoke.xcresult
            ${{ runner.temp }}/ipad-launch-diagnostics
          retention-days: 1
          if-no-files-found: warn

  dotnet-maui-compile:
    name: .NET MAUI managed compile and rendered pages
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UseArtifactsOutput: 'true'
    steps:
      - name: Check out consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prepare verified candidate
        uses: ./.github/actions/prepare-native-contract
        with:
          candidate-revision-sha: ${{ needs.verify.outputs.revision-sha }}
          expected-contract-repository: vouchington/vouchington
          github-token: ${{ github.token }}
          producer-run-attempt: ${{ github.run_attempt }}
          producer-run-id: ${{ github.run_id }}
      - name: Restore NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/voucha-dotnet-cache
            ${{ github.workspace }}/candidate-clients/.nuget/packages
            ${{ github.workspace }}/candidate-clients/.nuget/http-cache
            ${{ github.workspace }}/candidate-clients/.nuget/plugins-cache
          key: ${{ runner.os }}-nuget-maui-${{ hashFiles('candidate-clients/dotnet-clients/**/*.lock.json', 'candidate-clients/dotnet-clients/Directory.Packages.props', 'candidate-clients/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-maui-
      - name: Configure isolated MAUI paths
        shell: bash
        run: |
          {
            echo "ArtifactsPath=$RUNNER_TEMP/voucha-dotnet-lock-artifacts/app-tests"
            echo "VOUCHA_DOTNET_LOCK_ARTIFACTS_ROOT=$RUNNER_TEMP/voucha-dotnet-lock-artifacts"
            echo "VOUCHA_DOTNET_LOCK_SCRATCH_ROOT=$RUNNER_TEMP/voucha-dotnet-lock-scratch"
          } >>"$GITHUB_ENV"
      - name: Set up mise-managed .NET SDK
        uses: ./.github/actions/setup-mise-toolchain
        with:
          client-root: candidate-clients
          tool: dotnet
      - name: Detect pinned MAUI workload
        id: workload
        working-directory: candidate-clients
        run: |
          set -euo pipefail
          expected=$(jq -r '.sdk.workloadVersion' global.json)
          installed=$(dotnet workload --version 2>/dev/null || true)
          if [ "$installed" = "$expected" ] && dotnet workload list | awk '$1 == "maui-maccatalyst" { found = 1 } END { exit !found }'; then
            echo 'install=false' >>"$GITHUB_OUTPUT"
          else
            echo 'install=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Install pinned MAUI workload
        if: steps.workload.outputs.install == 'true'
        working-directory: candidate-clients
        run: >-
          dotnet workload install maui-maccatalyst
          --configfile dotnet-clients/NuGet.config
      - name: Verify all twelve committed NuGet locks
        working-directory: candidate-clients
        run: >-
          bash dotnet-clients/tooling/restore-locks.sh verify
      - name: Build rendered MAUI page tests
        working-directory: candidate-clients
        run: >-
          dotnet build dotnet-clients/tests/Voucha.Client.App.Tests/Voucha.Client.App.Tests.csproj
          --configuration Release --no-restore
      - name: Test rendered MAUI pages
        timeout-minutes: 18
        working-directory: candidate-clients
        env:
          VSTEST_DUMP_PATH: ${{ runner.temp }}/voucha-maui-test-results/dumps
          VSTEST_DUMP_TEMP_PATH: ${{ runner.temp }}/voucha-maui-test-results/tmp
          VSTEST_DIAG: ${{ runner.temp }}/voucha-maui-test-results/vstest.log
        run: |
          mkdir -p "$VSTEST_DUMP_PATH" "$VSTEST_DUMP_TEMP_PATH"
          dotnet test dotnet-clients/tests/Voucha.Client.App.Tests/Voucha.Client.App.Tests.csproj \
            --configuration Release --no-build \
            --logger "console;verbosity=detailed" \
            --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini \
            --results-directory "$RUNNER_TEMP/voucha-maui-test-results"
      - name: Upload failed MAUI test diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: maui-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voucha-maui-test-results
          retention-days: 1
          if-no-files-found: warn
      - name: Select compatible Xcode
        working-directory: candidate-clients
        run: bash dotnet-clients/tooling/select-xcode.sh 26.6
      - name: Detect host Mac Catalyst RID
        id: rid
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) rid=maccatalyst-arm64 ;;
            x86_64) rid=maccatalyst-x64 ;;
            *) echo "Unsupported macOS architecture: $(uname -m)"; exit 1 ;;
          esac
          echo "runtime_identifier=$rid" >>"$GITHUB_OUTPUT"
      - name: Restore the shared MAUI project-reference graph
        working-directory: candidate-clients
        env:
          ArtifactsPath: ${{ env.VOUCHA_DOTNET_LOCK_ARTIFACTS_ROOT }}/app-${{ steps.rid.outputs.runtime_identifier }}
        run: |
          dotnet restore dotnet-clients/src/Voucha.Client.App/Voucha.Client.App.csproj \
            -p:Configuration=Release -p:TargetFramework=net10.0-maccatalyst \
            -p:RuntimeIdentifier=${{ steps.rid.outputs.runtime_identifier }} --locked-mode
          dotnet restore dotnet-clients/src/Voucha.Client.Core/Voucha.Client.Core.csproj \
            -p:Configuration=Release -p:TargetFramework=net10.0 --locked-mode
      - name: Build managed Mac Catalyst CoreBuild closure
        working-directory: candidate-clients
        env:
          ArtifactsPath: ${{ env.VOUCHA_DOTNET_LOCK_ARTIFACTS_ROOT }}/app-${{ steps.rid.outputs.runtime_identifier }}
        run: >-
          dotnet build dotnet-clients/src/Voucha.Client.App/Voucha.Client.App.csproj
          --configuration Release --framework net10.0-maccatalyst
          "-p:RuntimeIdentifier=${{ steps.rid.outputs.runtime_identifier }}"
          --no-restore -t:CoreBuild -clp:PerformanceSummary
      - name: Pack exact managed compile state
        timeout-minutes: 2
        working-directory: candidate-clients
        env:
          CANDIDATE_REVISION: ${{ needs.verify.outputs.revision-sha }}
        run: |
          bash dotnet-clients/tooling/catalyst-compile-state.sh pack \
            "$VOUCHA_DOTNET_LOCK_ARTIFACTS_ROOT/app-${{ steps.rid.outputs.runtime_identifier }}" \
            "$RUNNER_TEMP/catalyst-compile-state" . "$CANDIDATE_REVISION" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "${{ steps.rid.outputs.runtime_identifier }}" "$(dotnet --version)" \
            "$(dotnet workload --version)" "$(xcodebuild -version | head -n 1)"
          du -h "$RUNNER_TEMP/catalyst-compile-state/compile-state.tar.gz"
          du -h "$RUNNER_TEMP/catalyst-compile-state/source-state.tar.gz"
      - name: Upload exact managed compile state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: catalyst-compile-${{ needs.verify.outputs.revision-sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.rid.outputs.runtime_identifier }}
          path: ${{ runner.temp }}/catalyst-compile-state
          if-no-files-found: error
          retention-days: 1
