name: Scratch repro10 real render-prompt

# Disposable repro for #107 fix confirmation. Calls the REAL
# jonathanong/auto-harness/actions/harness-render-prompt action (not a shell
# stand-in) to prove it is now admitted under the repaired Actions allowlist
# (vouchington-infra#174). Will be reverted immediately after the test run,
# regardless of outcome.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render-prompt:
    name: Render automation prompt (real action)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false

      - name: Prepare prompt variables
        run: |
          set -euo pipefail
          printf '%s' "Scratch repro10 issue title" > issue-title.txt
          printf '%s' "Scratch repro10 request body" > request-body.txt

      - name: Render prompt
        id: render
        uses: jonathanong/auto-harness/actions/harness-render-prompt@9bda991f8251decdbe683a6ce3badaa8717d4c14 # v1.0.0
        with:
          template: docs/prompts/automation/plan.md
          vars: |
            ISSUE_NUMBER=0
            ISSUE_URL=https://github.com/vouchington/vouchington-clients/issues/118
            TRIGGER_COMMENT_ID=0
          var-files: |
            ISSUE_TITLE=issue-title.txt
            REQUEST_BODY=request-body.txt

      - name: Report rendered prompt length
        run: |
          set -euo pipefail
          echo "Rendered prompt length: ${#PROMPT}"
        env:
          PROMPT: ${{ steps.render.outputs.prompt }}
