name: Validate request final code review

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

concurrency:
  group: >-
    validate-request-final-code-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  request-final-code-review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Request final code review for the tested ready head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ''
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_LABEL: final-code-review:requested
          COMPLETE_LABEL: final-code-review:complete
          GH_RETRY_ATTEMPTS: '3'
          GH_RETRY_BACKOFF_SECONDS: '5'
          GH_RETRY_TRANSPORT_MARKERS: |
            net/http: TLS handshake timeout
            net/http: timeout awaiting response headers
            connection reset by peer
            unexpected EOF
            i/o timeout
        run: |
          set -euo pipefail
          [[ "$TESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid CI head SHA'; exit 1; }
          [ -n "${GH_TOKEN:-}" ] || { echo '::error::github.token is required for router reads'; exit 1; }
          mutation_token="${{ secrets.CODE_REVIEW_TRIGGER_TOKEN }}"
          [ -n "$mutation_token" ] || { echo '::error::CODE_REVIEW_TRIGGER_TOKEN is required'; exit 1; }
          # Token presence does not prove the read scopes; the first API calls below assert
          # the configured actions, checks, and pull-requests permissions in order.
          gh_capture_retry() {
            local accepted="$1"; shift
            local attempt=1 status stdout_file stderr_file stderr_output http_status reason marker
            stdout_file="stdout-$$.log"; stderr_file="stderr-$$.log"
            while true; do
              status=0; "$@" > "$stdout_file" 2> "$stderr_file" || status=$?
              if [ "$status" -eq 0 ]; then
                GH_RETRY_OUTPUT="$(cat "$stdout_file")"
                rm -f "$stdout_file" "$stderr_file"; return 0
              fi
              stderr_output="$(cat "$stderr_file")"; http_status=""
              if [[ "$stderr_output" =~ HTTP\ ([0-9]{3}) ]]; then http_status="${BASH_REMATCH[1]}"; fi
              if [ -n "$http_status" ] && [ "$http_status" = "$accepted" ]; then
                GH_RETRY_OUTPUT=''; rm -f "$stdout_file" "$stderr_file"; return 0
              fi
              reason=""
              if [ -z "$http_status" ]; then
                while IFS= read -r marker; do case "$stderr_output" in *"$marker"*) reason=transport;; esac; done <<< "$GH_RETRY_TRANSPORT_MARKERS"
              elif [ "$http_status" = 403 ] || [ "$http_status" = 429 ] || [ "$http_status" -ge 500 ]; then
                reason="HTTP $http_status"
              fi
              if [ -z "$reason" ] || [ "$attempt" -ge "$GH_RETRY_ATTEMPTS" ]; then
                rm -f "$stdout_file" "$stderr_file"; printf '%s\n' "$stderr_output" >&2; return "$status"
              fi
              echo "::warning::GitHub API $reason; retrying attempt $((attempt + 1))/$GH_RETRY_ATTEMPTS."
              rm -f "$stdout_file" "$stderr_file"
              sleep "$((attempt * GH_RETRY_BACKOFF_SECONDS))"; attempt=$((attempt + 1))
            done
          }
          gh_mutate_retry() {
            GH_TOKEN="$mutation_token" gh_capture_retry "$@"
          }

          if [ -z "$PR_NUMBER" ]; then
            gh_capture_retry none gh api --method GET \
              "repos/$GITHUB_REPOSITORY/commits/$TESTED_HEAD_SHA/pulls"
            matches="$(jq -c --arg sha "$TESTED_HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" --arg base "$DEFAULT_BRANCH" --arg head_repo "$SOURCE_HEAD_REPOSITORY" \
              '[.[] | select(.state == "open" and .head.sha == $sha and .head.repo.full_name == $head_repo and .base.repo.full_name == $repo and .base.ref == $base)]' \
              <<< "$GH_RETRY_OUTPUT")"
            [ "$(jq 'length' <<< "$matches")" -eq 1 ] || {
              echo '::error::Could not resolve exactly one open pull request for the Validate head.'; exit 1;
            }
            PR_NUMBER="$(jq -r '.[0].number' <<< "$matches")"
          fi

          gh_capture_retry none gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          pr_json="$GH_RETRY_OUTPUT"
          [ "$(jq -r '.state' <<< "$pr_json")" = open ] || exit 0
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          if [ "$is_draft" = true ]; then
            encoded_requested_label="$(jq -rn --arg value "$REQUESTED_LABEL" '$value | @uri')"
            encoded_complete_label="$(jq -rn --arg value "$COMPLETE_LABEL" '$value | @uri')"
            gh_mutate_retry 404 gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$encoded_requested_label" --silent
            echo "Cleared $REQUESTED_LABEL for draft PR #$PR_NUMBER."
            gh_mutate_retry 404 gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$encoded_complete_label" --silent
            echo "Cleared $COMPLETE_LABEL for draft PR #$PR_NUMBER."
            echo "Skipping final code review because PR #$PR_NUMBER is a draft."
            exit 0
          fi
          if [ "$current_head_sha" != "$TESTED_HEAD_SHA" ]; then
            echo "Skipping stale Validate result for $TESTED_HEAD_SHA; PR head is $current_head_sha."
            exit 0
          fi

          gh_capture_retry none gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" \
            -f filter=all -f per_page=100 --paginate --slurp
          jobs="$GH_RETRY_OUTPUT"
          # Keep pagination across all attempts: Validate can grow beyond one page, and the
          # lowercase validate fan-in job is the exact ready-head eligibility boundary.
          eligible="$(jq -r \
            '([.[].jobs[] | select(.name == "validate")] | sort_by(.run_attempt, .id) | last | .conclusion) == "success"' \
            <<< "$jobs")"
          if [ "$eligible" != true ]; then
            echo 'Skipping final review because the exact-head Validate fan-in did not pass.'
            exit 0
          fi

          gh_capture_retry none gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          live_state="$GH_RETRY_OUTPUT"
          [ "$(jq -r '.state' <<< "$live_state")" = open ] || exit 0
          [ "$(jq -r '.draft' <<< "$live_state")" = false ] || {
            echo "Skipping final code review because PR #$PR_NUMBER became a draft."; exit 0;
          }
          [ "$(jq -r '.head.sha' <<< "$live_state")" = "$TESTED_HEAD_SHA" ] || {
            echo 'Skipping final code review because the PR head changed after validation.'; exit 0;
          }

          gh_capture_retry none gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits/$TESTED_HEAD_SHA/check-runs" \
            -f filter=latest -f per_page=100 --paginate --slurp
          checks_json="$GH_RETRY_OUTPUT"
          review_state=missing
          while IFS=$'\t' read -r status conclusion run_id; do
            [ -n "$run_id" ] || continue
            gh_capture_retry none gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            jq -e '.path == ".github/workflows/final-code-review.yml" and .event == "pull_request_target"' \
              <<< "$GH_RETRY_OUTPUT" >/dev/null || continue
            if [ "$status" = completed ]; then review_state="$conclusion"; else review_state=active; fi
            break
          done < <(jq -r \
            '[.[].check_runs[] | select(.name == "Code Reviewed" and .app.slug == "github-actions")] |
             sort_by(.id) | reverse[] | [.status, (.conclusion // "none"), (try (.details_url | capture("/actions/runs/(?<id>[0-9]+)/").id) catch "")] | @tsv' \
            <<< "$checks_json")
          case "$review_state" in active|success) echo "Skipping duplicate final review ($review_state)."; exit 0;; esac

          encoded_complete_label="$(jq -rn --arg value "$COMPLETE_LABEL" '$value | @uri')"
          gh_mutate_retry 404 gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$encoded_complete_label" --silent

          encoded_label="$(jq -rn --arg value "$REQUESTED_LABEL" '$value | @uri')"
          gh_mutate_retry 404 gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$encoded_label" --silent
          gh_capture_retry none gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          final_state="$GH_RETRY_OUTPUT"
          [ "$(jq -r '.state' <<< "$final_state")" = open ] || exit 0
          [ "$(jq -r '.draft' <<< "$final_state")" = false ] || {
            echo 'Skipping final code review because the PR became a draft before label creation.'; exit 0;
          }
          [ "$(jq -r '.head.sha' <<< "$final_state")" = "$TESTED_HEAD_SHA" ] || {
            echo 'Skipping final code review because the PR head changed before label creation.'; exit 0;
          }
          gh_mutate_retry none gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f "labels[]=$REQUESTED_LABEL" --silent
