name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-tests:
    name: Contract assertions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
      - name: Install pinned contract-test dependencies
        run: pnpm install --frozen-lockfile
      - name: Test contract boundary
        run: pnpm run test:coverage

  dotnet-core:
    name: .NET core build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-mise-toolchain
        with:
          client-root: .
          tool: dotnet
      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git diff --check "$BASE_SHA...HEAD"
      - name: Restore locked dependencies
        working-directory: dotnet-clients
        run: dotnet restore Voucha.DotNet.sln --locked-mode
      - name: Check .NET formatting
        working-directory: dotnet-clients
        run: dotnet format Voucha.DotNet.sln --verify-no-changes --no-restore
      - name: Build core client
        working-directory: dotnet-clients
        run: dotnet build tests/Voucha.Client.Core.Tests/Voucha.Client.Core.Tests.csproj --configuration Release --no-restore

  tooling-lint:
    name: Portable tooling lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install mise Swift runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libncurses6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
          install: false
      - name: Install the pinned portable lint tools
        run: >-
          mise install actionlint shellcheck github:boyter/scc zizmor
          aqua:gitleaks/gitleaks aqua:lycheeverse/lychee
      - name: Install pinned tooling dependencies
        run: pnpm install --frozen-lockfile
      - name: Run portable tooling checks
        run: pnpm run lint:portable

  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
          install: false
      - name: Install the pinned secret scanner
        run: mise install aqua:gitleaks/gitleaks
      - name: Scan repository history
        run: |
          gitleaks_dir="$(mise --no-config where aqua:gitleaks/gitleaks)"
          "$gitleaks_dir/gitleaks" git --redact=100 --config .gitleaks.toml

  swift-lint:
    name: Swift format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install mise Swift runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libncurses6
      - name: Check Swift formatting and lint
        run: bash swift-clients/tooling/harness.sh --checks fmt,lint,lint-tests

  swift-core:
    name: Swift manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate core package manifest
        run: >-
          docker run --rm --read-only --network none
          --tmpfs /tmp:rw,exec,mode=1777
          --volume "$PWD:/workspace:ro"
          --workdir /workspace
          --env HOME=/tmp
          swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
          swift package --package-path swift-clients/core dump-package >/dev/null

  validate:
    name: validate
    if: always()
    needs: [contract-tests, dotnet-core, swift-core, tooling-lint, gitleaks, swift-lint]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require client validation
        env:
          CONTRACT_TESTS_RESULT: ${{ needs.contract-tests.result }}
          DOTNET_RESULT: ${{ needs.dotnet-core.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SWIFT_RESULT: ${{ needs.swift-core.result }}
          SWIFT_LINT_RESULT: ${{ needs.swift-lint.result }}
          TOOLING_LINT_RESULT: ${{ needs.tooling-lint.result }}
        run: |
          set -euo pipefail
          [ "$CONTRACT_TESTS_RESULT" = success ] || { echo "::error::Contract assertions failed."; exit 1; }
          [ "$DOTNET_RESULT" = success ] || { echo "::error::.NET core validation failed."; exit 1; }
          [ "$GITLEAKS_RESULT" = success ] || { echo "::error::Gitleaks validation failed."; exit 1; }
          [ "$SWIFT_RESULT" = success ] || { echo "::error::Swift core validation failed."; exit 1; }
          [ "$SWIFT_LINT_RESULT" = success ] || { echo "::error::Swift lint validation failed."; exit 1; }
          [ "$TOOLING_LINT_RESULT" = success ] || { echo "::error::Portable tooling validation failed."; exit 1; }
