name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_call:
    secrets:
      DEPENDABOT_AUTOMERGE_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Called workflows inherit github.workflow from the caller. Keep the original
  # group so valid edited events still serialize with head/lifecycle events.
  group: Dependabot Auto-merge-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base-sha: ${{ steps.live.outputs.base-sha }}
      head-sha: ${{ steps.live.outputs.head-sha }}
      repair-kind: ${{ steps.classify.outputs.repair-kind }}
      eligible: ${{ steps.live.outputs.eligible }}
    steps:
      - name: Capture live Dependabot identity
        id: live
        timeout-minutes: 2
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/live-pr.json"
          jq -e --arg default "$DEFAULT_BRANCH" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and .user.login == "dependabot[bot]" and
            .base.ref == $default and .head.repo.full_name == $repo and
            (.head.ref | startswith("dependabot/")) and
            (.base.sha | test("^[a-f0-9]{40}$")) and
            (.head.sha | test("^[a-f0-9]{40}$")) and
            (.head.repo.full_name | type) == "string"
          ' "$RUNNER_TEMP/live-pr.json" > /dev/null
          head_sha="$(jq -r .head.sha "$RUNNER_TEMP/live-pr.json")"
          base_sha="$(jq -r .base.sha "$RUNNER_TEMP/live-pr.json")"
          {
            printf 'base-sha=%s\n' "$base_sha"
            printf 'head-sha=%s\n' "$head_sha"
            # Cleanup may run after a later commit lookup fails, but only after
            # this exact live PR identity has passed the checks above.
            printf 'eligible=false\n'
          } >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha" > "$RUNNER_TEMP/head-commit.json"
          jq -e --arg expected "$head_sha" '
            .sha == $expected and
            (.commit.verification.verified | type) == "boolean" and
            (.author == null or ((.author | type) == "object" and (.author.login | type) == "string")) and
            (.committer == null or ((.committer | type) == "object" and (.committer.login | type) == "string"))
          ' "$RUNNER_TEMP/head-commit.json" > /dev/null
          eligible="$(jq -r '(
            .author.login == "dependabot[bot]" and .committer.login == "web-flow" and
            .commit.verification.verified
          ) == true' "$RUNNER_TEMP/head-commit.json")"
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"
          if [ "$eligible" != true ]; then
            echo 'Head is not a verified Dependabot commit; use the ordinary reviewed PR path.'
          fi
      - name: Fetch trusted Dependabot metadata
        if: steps.live.outputs.eligible == 'true'
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Check out exact trusted base
        if: steps.live.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.live.outputs.base-sha }}
      - name: Set up trusted Node.js
        if: steps.live.outputs.eligible == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        if: steps.live.outputs.eligible == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
      - name: Install trusted repair dependencies
        if: steps.live.outputs.eligible == 'true'
        run: pnpm install --frozen-lockfile
      - name: Bind the live PR to its exact commit diff
        if: steps.live.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.live.outputs.base-sha }}
          EXPECTED_HEAD_SHA: ${{ steps.live.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token_b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: Basic $token_b64" \
            git fetch --no-tags origin "$EXPECTED_HEAD_SHA"
          git diff --raw --full-index -z --find-renames "$BASE_SHA...$EXPECTED_HEAD_SHA" > "$RUNNER_TEMP/exact-dependabot-diff"
      - name: Classify trusted Swift Android repair
        if: steps.live.outputs.eligible == 'true'
        id: classify
        env:
          BASE_SHA: ${{ steps.live.outputs.base-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DIRECTORY: ${{ steps.dependabot-metadata.outputs.directory }}
          EXPECTED_HEAD_SHA: ${{ steps.live.outputs.head-sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PACKAGE_ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.dependabot-metadata.outputs.updated-dependencies-json }}
          LIVE_PR_PATH: ${{ runner.temp }}/live-pr.json
          EXACT_DIFF_PATH: ${{ runner.temp }}/exact-dependabot-diff
        run: |
          set -euo pipefail
          node scripts/classify-dependabot-swift-android-repair.mjs \
            "$BASE_SHA" "$EXPECTED_HEAD_SHA" "$GITHUB_OUTPUT"
      - name: Fetch candidate files as inert data
        if: steps.live.outputs.eligible == 'true' && steps.classify.outputs.repair-kind == 'swift-android'
        env:
          BASE_SHA: ${{ steps.live.outputs.base-sha }}
          EXPECTED_HEAD_SHA: ${{ steps.live.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/swift-candidate"
          mkdir -p "$candidate/swift-clients/apps/android/tooling"
          for path in swift-clients/apps/android/Package.swift swift-clients/apps/android/Package.resolved; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$EXPECTED_HEAD_SHA" > "$candidate/$path"
          done
          if git diff --name-only "$BASE_SHA...$EXPECTED_HEAD_SHA" -- \
            swift-clients/apps/android/tooling/materialize-skip-sdk.sh | grep -q .; then
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/swift-clients/apps/android/tooling/materialize-skip-sdk.sh?ref=$EXPECTED_HEAD_SHA" \
              > "$candidate/swift-clients/apps/android/tooling/materialize-skip-sdk.sh"
          fi
      - name: Verify exact Skip tag revision
        if: steps.live.outputs.eligible == 'true' && steps.classify.outputs.repair-kind == 'swift-android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/swift-candidate/swift-clients/apps/android/Package.resolved"
          version="$(jq -er '.pins[] | select(.identity == "skip") | .state.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$resolved")"
          revision="$(jq -er '.pins[] | select(.identity == "skip") | .state.revision | select(test("^[a-f0-9]{40}$"))' "$resolved")"
          [[ "$revision" == "$(gh api "repos/skiptools/skip/commits/$version" --jq .sha)" ]]
      - name: Build verified Swift Android repair artifact
        if: steps.live.outputs.eligible == 'true' && steps.classify.outputs.repair-kind == 'swift-android'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/swift-repair-metadata.json"
          output="$RUNNER_TEMP/dependabot-swift-android-repair"
          jq --arg repository "$GITHUB_REPOSITORY" --arg default "$DEFAULT_BRANCH" \
            --arg run "$GITHUB_RUN_ID" \
            '{run_id:($run|tonumber),repository:{full_name:$repository,default_branch:$default},pull_request:.}' \
            "$RUNNER_TEMP/live-pr.json" > "$metadata"
          node scripts/repair-dependabot-swift-android.mjs \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/swift-candidate" "$metadata" \
            "$RUNNER_TEMP/exact-dependabot-diff" "$output"
      - name: Upload verified Swift Android repair
        if: steps.live.outputs.eligible == 'true' && steps.classify.outputs.repair-kind == 'swift-android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          if-no-files-found: error
          name: dependabot-swift-android-repair-${{ github.event.pull_request.number }}
          overwrite: true
          path: ${{ runner.temp }}/dependabot-swift-android-repair
          retention-days: 1
  publish-swift-android:
    needs: prepare
    if: needs.prepare.outputs.repair-kind == 'swift-android'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.commit.outputs.head-sha }}
    steps:
      - name: Check out exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base-sha }}
      - name: Set up trusted Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
      - name: Install trusted repair dependencies
        run: pnpm install --frozen-lockfile
      - name: Download same-run Swift Android artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          github-token: ${{ github.token }}
          name: dependabot-swift-android-repair-${{ github.event.pull_request.number }}
          path: repair-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Verify artifact and construct exact repair commit
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          materializer=swift-clients/apps/android/tooling/materialize-skip-sdk.sh
          provenance=repair-artifact/dependabot-swift-android-provenance.json
          [[ -f "repair-artifact/$materializer" && ! -L "repair-artifact/$materializer" ]]
          [[ -f "$provenance" && ! -L "$provenance" ]]
          [[ "$(find repair-artifact -type f | wc -l | tr -d ' ')" == 2 ]]
          [[ -z "$(find repair-artifact -type l -print -quit)" ]]
          node scripts/validate-dependabot-swift-repair.mjs provenance "$provenance" \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$GITHUB_RUN_ID" "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          [[ "$(shasum -a 256 "repair-artifact/$materializer" | cut -d ' ' -f 1)" == \
            "$(jq -r .materializerSha256 "$provenance")" ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/live-pr.json"
          token_b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: Basic $token_b64" \
            git fetch --no-tags origin "$EXPECTED_HEAD_SHA"
          git diff --raw --full-index -z --find-renames "$EXPECTED_BASE_SHA...$EXPECTED_HEAD_SHA" > "$RUNNER_TEMP/exact-dependabot-diff"
          node scripts/validate-dependabot-swift-repair.mjs pull-request \
            "$RUNNER_TEMP/live-pr.json" "$RUNNER_TEMP/exact-dependabot-diff" \
            "$DEFAULT_BRANCH" "$GITHUB_REPOSITORY" "$HEAD_REF" "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          manifest_hash="$(git cat-file blob "$EXPECTED_HEAD_SHA:swift-clients/apps/android/Package.swift" | shasum -a 256 | cut -d ' ' -f 1)"
          resolved_hash="$(git cat-file blob "$EXPECTED_HEAD_SHA:swift-clients/apps/android/Package.resolved" | shasum -a 256 | cut -d ' ' -f 1)"
          [[ "$manifest_hash" == "$(jq -r .manifestSha256 "$provenance")" ]]
          [[ "$resolved_hash" == "$(jq -r .resolvedSha256 "$provenance")" ]]
          version="$(jq -r .skipVersion "$provenance")"
          revision="$(jq -r .skipRevision "$provenance")"
          [[ "$revision" == "$(gh api "repos/skiptools/skip/commits/$version" --jq .sha)" ]]
          index="$RUNNER_TEMP/dependabot-swift-publish.index"
          rm -f -- "$index"
          GIT_INDEX_FILE="$index" git read-tree "$EXPECTED_HEAD_SHA"
          [[ "$(git ls-tree "$EXPECTED_HEAD_SHA" -- "$materializer" | awk '{print $1 " " $2}')" == '100755 blob' ]]
          blob="$(git hash-object -w -- "repair-artifact/$materializer")"
          GIT_INDEX_FILE="$index" git update-index --add --cacheinfo "100755,$blob,$materializer"
          tree="$(GIT_INDEX_FILE="$index" git write-tree)"
          if [[ "$tree" == "$(git rev-parse "$EXPECTED_HEAD_SHA^{tree}")" ]]; then
            printf 'mode=noop\nhead-sha=%s\n' "$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit="$(printf '%s\n' 'chore(deps): synchronize Skip Android materializer' | \
            GIT_AUTHOR_NAME='dependabot[bot]' GIT_AUTHOR_EMAIL='49699333+dependabot[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='dependabot[bot]' GIT_COMMITTER_EMAIL='49699333+dependabot[bot]@users.noreply.github.com' \
            git commit-tree "$tree" -p "$EXPECTED_HEAD_SHA")"
          git diff-tree --no-commit-id --name-only -r -z "$EXPECTED_HEAD_SHA" "$commit" > "$RUNNER_TEMP/published-swift-paths"
          node scripts/validate-dependabot-swift-repair.mjs published-paths "$RUNNER_TEMP/published-swift-paths"
          printf 'mode=repair\nhead-sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Final live revalidation
        if: steps.commit.outputs.mode == 'repair'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/final-pr.json"
          node scripts/validate-dependabot-swift-repair.mjs pull-request \
            "$RUNNER_TEMP/final-pr.json" "$RUNNER_TEMP/exact-dependabot-diff" \
            "$DEFAULT_BRANCH" "$GITHUB_REPOSITORY" "$HEAD_REF" "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
      - name: Push with a single-command write credential
        if: steps.commit.outputs.mode == 'repair'
        env:
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPAIRED_HEAD_SHA: ${{ steps.commit.outputs.head-sha }}
          WRITE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail
          write_token_b64="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: Basic $write_token_b64" \
            git push --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_HEAD_SHA" \
              origin "$REPAIRED_HEAD_SHA:refs/heads/$HEAD_REF"
  automerge:
    needs: [prepare, publish-swift-android]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.eligible == 'true' &&
      (needs.prepare.outputs.repair-kind == 'none' || needs.publish-swift-android.result == 'success')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Enable eligible Dependabot auto-merge
        uses: vouchington/vouchington-tooling/.github/actions/dependabot-automerge@65310ad7da87fd8d3619ca7868107d46c9c607d9 # v0.53.0
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          expected_base_sha: ${{ needs.prepare.outputs.base-sha }}
          expected_head_sha: ${{ needs.publish-swift-android.outputs.head-sha || needs.prepare.outputs.head-sha }}
          manual_update_rules: '[{"packageEcosystem":"nuget","directory":"/dotnet-clients"}]'

  cleanup-retargeted-automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Disable stale Dependabot auto-merge
        uses: vouchington/vouchington-tooling/.github/actions/dependabot-automerge@65310ad7da87fd8d3619ca7868107d46c9c607d9 # v0.53.0
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}

  cleanup-ineligible-automerge:
    needs: prepare
    if: >-
      always() && needs.prepare.result != 'cancelled' &&
      needs.prepare.outputs.eligible == 'false'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge for the ineligible head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/ineligible-pr.json"
          jq -e \
            --arg default "$DEFAULT_BRANCH" \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg number "$PR_NUMBER" \
            --arg repository "$REPOSITORY" '
              .state == "open" and .draft == false and
              (.number | tostring) == $number and
              .user.login == "dependabot[bot]" and
              .base.ref == $default and
              .head.repo.full_name == $repository and
              (.head.ref | startswith("dependabot/")) and
              (.head.sha | type) == "string" and
              (.head.sha | test("^[a-f0-9]{40}$")) and .head.sha == $head and
              ($head | test("^[a-f0-9]{40}$")) and
              has("auto_merge") and
              (
                .auto_merge == null or
                (
                  (.auto_merge | type) == "object" and
                  (.auto_merge | has("enabled_by") and has("merge_method") and has("commit_title") and has("commit_message")) and
                  (.auto_merge.enabled_by | type) == "object" and
                  (.auto_merge.enabled_by.login | type) == "string" and
                  (.auto_merge.merge_method | IN("merge", "squash", "rebase")) and
                  (.auto_merge.commit_title == null or (.auto_merge.commit_title | type) == "string") and
                  (.auto_merge.commit_message == null or (.auto_merge.commit_message | type) == "string")
                )
              )
            ' "$RUNNER_TEMP/ineligible-pr.json" > /dev/null
          if [ "$(jq -r '.auto_merge == null' "$RUNNER_TEMP/ineligible-pr.json")" = true ]; then
            echo 'Auto-merge is already disabled for the verified ineligible head.'
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --disable-auto
