name: Scratch repro8 callee (workflow_call)

on:
  workflow_call:
    inputs:
      concurrency-id:
        type: string
        required: true
    secrets:
      SCRATCH_SECRET:
        required: true
    outputs:
      ran:
        value: ${{ jobs.dispatch.outputs.ran }}

concurrency:
  group: scratch-repro8-${{ inputs.concurrency-id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Scratch dispatch
    environment: auto-harness
    runs-on: [self-hosted, Linux]
    timeout-minutes: 2
    concurrency:
      group: scratch-repro8-fleet-admission
      queue: max
      cancel-in-progress: false
    outputs:
      ran: ${{ steps.mark.outputs.ran }}
    steps:
      - id: mark
        env:
          SCRATCH_SECRET: ${{ secrets.SCRATCH_SECRET }}
        run: |
          set -euo pipefail
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "secret length: ${#SCRATCH_SECRET}"
