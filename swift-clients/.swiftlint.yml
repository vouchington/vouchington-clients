included:
  - core/Sources
  - ui/Sources
  - apps

excluded:
  - .build
  - '**/.build'
  - DerivedData
  - ui/Sources/VouchaLocalization/Generated

line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 200
  error: 250

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 150
  error: 200

identifier_name:
  excluded:
    - id
    - xs
    - sm
    - md
    - lg
    - xl

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports
  - toggle_bool

disabled_rules:
  - todo
