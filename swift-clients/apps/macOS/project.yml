name: Voucha
options:
  bundleIdPrefix: ai.voucha
  deploymentTarget:
    macOS: '14.4'
  xcodeVersion: '16.0'
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    CURRENT_PROJECT_VERSION: '1'
    MACOSX_DEPLOYMENT_TARGET: '14.4'
    CODE_SIGN_STYLE: Automatic
    VOUCHA_API_BASE_URL: 'https://voucha.ai'
    VOUCHA_IMAGE_BASE_URL: 'https://images.voucha.ai'
    VOUCHA_TURNSTILE_SITE_KEY: ''
    VOUCHA_SENTRY_DSN: ''
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
  configs:
    Debug:
      VOUCHA_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'

packages:
  VouchaCore:
    path: ../../core
  VouchaUI:
    path: ../../ui
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.31.0

targets:
  Voucha:
    type: application
    platform: macOS
    deploymentTarget: '14.4'
    sources:
      - path: Sources
      - path: ../shared-app
      - path: Resources
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleDisplayName: Voucha
        ITSAppUsesNonExemptEncryption: false
        VOUCHA_API_BASE_URL: '$(VOUCHA_API_BASE_URL)'
        VOUCHA_IMAGE_BASE_URL: '$(VOUCHA_IMAGE_BASE_URL)'
        VOUCHA_TURNSTILE_SITE_KEY: '$(VOUCHA_TURNSTILE_SITE_KEY)'
        VOUCHA_SENTRY_DSN: '$(VOUCHA_SENTRY_DSN)'
        CFBundleURLTypes:
          - CFBundleURLName: ai.voucha.macos
            CFBundleURLSchemes:
              - voucha
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.xml
            UTTypeDescription: Outline Processor Markup Language
            UTTypeIdentifier: ai.voucha.opml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
              public.mime-type:
                - text/x-opml
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        NSLocalNetworkUsageDescription: Voucha connects to language models on your local network.
        NSHumanReadableCopyright: Copyright © 2026 Voucha. All rights reserved.
    entitlements:
      path: Voucha.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.associated-domains:
          - applinks:voucha.ai
          - webcredentials:voucha.ai
        com.apple.developer.applesignin:
          - Default
        keychain-access-groups:
          - $(AppIdentifierPrefix)ai.voucha.macos
    configFiles:
      Debug: ../Voucha.local.xcconfig
      Release: ../Voucha.local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.voucha.macos
        PRODUCT_NAME: Voucha
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Voucha.entitlements
    preBuildScripts:
      - name: Require explicit non-test Turnstile site key
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            "${SRCROOT}/../../tooling/turnstile-release-site-key.sh" "${VOUCHA_TURNSTILE_SITE_KEY}"
          fi
    dependencies:
      - package: VouchaCore
        product: VouchaCore
      - package: VouchaCore
        product: VouchaModels
      - package: VouchaCore
        product: VouchaAPI
      - package: VouchaCore
        product: VouchaAuth
      - package: VouchaCore
        product: VouchaPersistence
      - package: VouchaUI
        product: VouchaDesignSystem
      - package: VouchaUI
        product: VouchaFeatures
      - package: VouchaUI
        product: VouchaLocalization
      - package: Sentry
        product: Sentry
    scheme:
      testTargets:
        - VouchaLaunchSmokeTests
        - VouchaSentryBoundaryTests
      environmentVariables:
        VOUCHA_API_BASE_URL: '$(VOUCHA_API_BASE_URL)'
        VOUCHA_FILAMENTS_CONTRACT_ROOT: '$(VOUCHA_FILAMENTS_CONTRACT_ROOT)'

  VouchaSentryBoundaryTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.4'
    sources:
      - path: SentrySdkBoundaryTests.swift
      - path: ../shared-app/SentryEventProjection.swift
    dependencies:
      - package: Sentry
        product: Sentry
      - package: VouchaCore
        product: VouchaCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.voucha.macos.sentry-boundary-tests
        PRODUCT_NAME: VouchaSentryBoundaryTests
        TEST_HOST: ''
        BUNDLE_LOADER: ''
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGNING_ALLOWED: NO

  VouchaLaunchSmokeTests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '14.4'
    sources:
      - path: ../shared-tests
    dependencies:
      - target: Voucha
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.voucha.macos.launch-smoke-tests
        PRODUCT_NAME: VouchaLaunchSmokeTests
