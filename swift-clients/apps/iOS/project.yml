name: Voucha
options:
  bundleIdPrefix: ai.voucha
  deploymentTarget:
    iOS: '17.4'
  xcodeVersion: '16.0'
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.4'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    VOUCHA_API_BASE_URL: 'https://voucha.ai'
    VOUCHA_IMAGE_BASE_URL: 'https://images.voucha.ai'
    VOUCHA_TURNSTILE_SITE_KEY: ''
    VOUCHA_SENTRY_DSN: ''
  configs:
    Debug:
      VOUCHA_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'

packages:
  VouchaCore:
    path: ../../core
  VouchaUI:
    path: ../../ui
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.31.0

targets:
  Voucha:
    type: application
    platform: iOS
    deploymentTarget: '17.4'
    sources:
      - path: Sources
      - path: ../shared-app
      - path: Resources
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleDisplayName: Voucha
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        VOUCHA_API_BASE_URL: '$(VOUCHA_API_BASE_URL)'
        VOUCHA_IMAGE_BASE_URL: '$(VOUCHA_IMAGE_BASE_URL)'
        VOUCHA_TURNSTILE_SITE_KEY: '$(VOUCHA_TURNSTILE_SITE_KEY)'
        VOUCHA_SENTRY_DSN: '$(VOUCHA_SENTRY_DSN)'
        CFBundleURLTypes:
          - CFBundleURLName: ai.voucha.ios
            CFBundleURLSchemes:
              - voucha
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.xml
            UTTypeDescription: Outline Processor Markup Language
            UTTypeIdentifier: ai.voucha.opml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
              public.mime-type:
                - text/x-opml
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        NSLocalNetworkUsageDescription: Voucha connects to language models on your local network.
    entitlements:
      path: Voucha.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:voucha.ai
          - webcredentials:voucha.ai
        com.apple.developer.applesignin:
          - Default
    configFiles:
      Debug: ../Voucha.local.xcconfig
      Release: ../Voucha.local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.voucha.ios
        PRODUCT_NAME: Voucha
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Voucha.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
    preBuildScripts:
      - name: Require explicit non-test Turnstile site key
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            "${SRCROOT}/../../tooling/turnstile-release-site-key.sh" "${VOUCHA_TURNSTILE_SITE_KEY}"
          fi
    dependencies:
      - package: VouchaCore
        product: VouchaCore
      - package: VouchaCore
        product: VouchaModels
      - package: VouchaCore
        product: VouchaAPI
      - package: VouchaCore
        product: VouchaAuth
      - package: VouchaCore
        product: VouchaPersistence
      - package: VouchaUI
        product: VouchaDesignSystem
      - package: VouchaUI
        product: VouchaFeatures
      - package: VouchaUI
        product: VouchaLocalization
      - package: Sentry
        product: Sentry
    scheme:
      testTargets:
        - VouchaLaunchSmokeTests
      environmentVariables:
        VOUCHA_API_BASE_URL: '$(VOUCHA_API_BASE_URL)'
        VOUCHA_FILAMENTS_CONTRACT_ROOT: '$(VOUCHA_FILAMENTS_CONTRACT_ROOT)'

  VouchaLaunchSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.4'
    sources:
      - path: ../shared-tests
    dependencies:
      - target: Voucha
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.voucha.ios.launch-smoke-tests
        PRODUCT_NAME: VouchaLaunchSmokeTests
