packages: []
allowBuilds:
  '@ast-grep/cli': true
  esbuild: false
  no-mistakes: true
strictDepBuilds: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security fix (ECONNRESET crash), published 2026-11-20; remove once older than 7 days (2026-11-27).
  - '@hono/node-server@2.1.11'
  - agent-blackboard
  - coverage-check
  - no-mistakes
  - no-mistakes-darwin-arm64
  - no-mistakes-linux-arm64-gnu
  - no-mistakes-linux-x64-gnu
  - no-mistakes-win32-x64-msvc
  - vouchington-tooling
preferFrozenLockfile: true
verifyDepsBeforeRun: error
