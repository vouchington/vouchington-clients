packages: []
allowBuilds:
  '@ast-grep/cli': true
  esbuild: false
  no-mistakes: true
strictDepBuilds: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - coverage-check
  - no-mistakes
  - pr-shepherd
  - vouchington-tooling
preferFrozenLockfile: true
verifyDepsBeforeRun: error
