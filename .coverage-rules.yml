# First matching rule owns a changed path.
#
# No `scope:` block: coverage-check@0.16.0's scope.analyzer is typed to the literal "javascript"
# only, and its executableLineNumbers() loader returns an empty line set for any extension other
# than .ts/.tsx/.js/.jsx/.mts/.cts/.mjs/.cjs — so scope can never flag a changed .cs/.xaml/.swift
# file as missing coverage, regardless of `include`. None of the paths this file gates are among
# those extensions; this repo's only JS/TS surface (scripts/, tests/) uses Node's own
# --experimental-test-coverage instead of this LCOV/coverage-check pipeline. A scope block here
# would parse but never fire. Verified against coverage-check/dist/src/scope.mjs
# (findMissingCoverage) and an --advisory --json - dry run against a real diff.
rules:
  # Rendered MAUI pages are compiled and tested separately, but Coverlet cannot instrument the app shell.
  - paths: "dotnet-clients/src/Voucha.Client.App/**"
    patch_coverage_min: 0
  - paths: "dotnet-clients/src/Voucha.Client.Core/**"
    patch_coverage_min: 80
  - paths: "swift-clients/apps/**"
    patch_coverage_min: 0
  - paths: "swift-clients/**/Package.swift"
    patch_coverage_min: 0
  # Integration suites require external services and are validated by pass/fail behavior, not unit coverage.
  - paths: "swift-clients/**/Tests/VouchaIntegrationTests/**"
    patch_coverage_min: 0
  - paths: "swift-clients/**"
    patch_coverage_min: 90
