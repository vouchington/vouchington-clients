# First matching rule owns a changed path.
rules:
  # Rendered MAUI pages are compiled and tested separately, but Coverlet cannot instrument the app shell.
  - paths: "dotnet-clients/src/Voucha.Client.App/**"
    patch_coverage_min: 0
  - paths: "dotnet-clients/src/Voucha.Client.Core/**"
    patch_coverage_min: 80
  - paths: "swift-clients/apps/**"
    patch_coverage_min: 0
  - paths: "swift-clients/**/Package.swift"
    patch_coverage_min: 0
  - paths: "swift-clients/**/Tests/VouchaIntegrationTests/**"
    patch_coverage_min: 0
  - paths: "swift-clients/**"
    patch_coverage_min: 90
