id: swift-no-hardcoded-presentation-data
language: Swift
severity: error
message: "App-owned presentation fields must carry UiMessageKey, UiMessage, or UiVerbatimText; raw String is reserved for typed protocol/user/server data."
files:
  - "swift-clients/ui/Sources/VouchaDesignSystem/**/*.swift"
  - "swift-clients/ui/Sources/VouchaFeatures/**/*.swift"
  - "swift-clients/apps/shared-app/**/*.swift"
  - "swift-clients/apps/iOS/Sources/**/*.swift"
  - "swift-clients/apps/macOS/Sources/**/*.swift"
rule:
  any:
    - all:
        - kind: value_argument
        - has:
            field: name
            regex: '^(?:title|subtitle|message|detail|label|status|error|validation|family|reason|actionTitle|placeholder)$'
        - has:
            any:
              - kind: line_string_literal
                regex: '^"[^"]*[A-Za-z]'
              - kind: multi_line_string_literal
                regex: '^"""[^\"]*[A-Za-z]'
            stopBy:
              all:
                - kind: value_argument
                - has:
                    field: name
                    regex: '.+'
        - inside:
            kind: call_expression
            regex: '^(?:\.init|\.(?:included|excluded)|NativeRouteCatalogEntry\.(?:included|excluded)|CommentThreadPostSection|NativeRouteDestinationRow|NativeRouteFamilyGroup|NativeProfileReportReason|NativeTag[A-Za-z0-9_]*|[A-Za-z0-9_]*(?:Row|Card|Action|Report|Catalog|Metadata|Presentation))\s*\('
            stopBy: end
    - all:
        - kind: call_expression
        - regex: '^(?:GrowthMetricRow|GrowthMetricSection|GrowthMiniBars)\s*\(\s*"[^"]*[A-Za-z]'
    - all:
        - kind: assignment
        - has:
            field: target
            regex: "^(?:navigationTitle|title|subtitle|label|message|detail|placeholder|[A-Za-z0-9_]*Error|(?:status|error|validation|[A-Za-z0-9_]*(?:Status|Error|Validation))Message)$"
        - regex: '=\s*(?:"[^"]*[A-Za-z]|[^,\n]+\?\s*"[^"]*[A-Za-z])'
    - all:
        - kind: assignment
        - has:
            field: target
            regex: "^(?:[A-Za-z0-9_]*Error|(?:error|[A-Za-z0-9_]*Error)Message)$"
        - regex: '=\s*[A-Za-z0-9_(). ]+\.localizedDescription\s*$'
    - all:
        - kind: call_expression
        - regex: '\.rawValue(?:\.replacingOccurrences\s*\([^)]*\))?(?:\.capitalized)?$'
        - any:
            - regex: '\.rawValue\.capitalized$'
            - regex: '\.rawValue\.replacingOccurrences\s*\('
            - regex: '\.rawValue\.replacingOccurrences\s*\([^)]*\)\.capitalized$'
    - all:
        - kind: call_expression
        - regex: '^(?:Text|Label|Button|TextField|SecureField|Picker|Toggle|Section|GroupBox|ContentUnavailableView|rawText|UiVerbatimText\.verbatim|\.verbatim)\s*\([^)]*\.rawValue'
        - not:
            regex: '\.protocolValue\s*\('
    - all:
        - kind: value_argument
        - regex: '^(?:title|subtitle|message|detail|label|status|placeholder)\s*:\s*[^,\n]*\.rawValue'
    - all:
        - kind: call_expression
        - regex: '^(?:Text|Label|Button|TextField|SecureField|Picker|Toggle|Section|GroupBox|ContentUnavailableView)\s*\('
        - has:
            kind: navigation_expression
            regex: '\.capitalized$'
            stopBy: end
    - all:
        - kind: property_declaration
        - has:
            field: name
            regex: "^(?:navigationTitle|title|subtitle|label|message|detail|placeholder|(?:status|error|validation|[A-Za-z0-9_]*(?:Status|Error|Validation))Message|[A-Za-z0-9_]*(?:Title|Subtitle|Label|Detail))$"
        - not:
            regex: ':\s*(?:UiMessageKey|UiMessage|UiVerbatimText)\s*\{'
        - any:
            - regex: '(?:=|\{)\s*"[^"]*[A-Za-z]'
            - regex: '(?:=|\{)[^{}\n]*(?:\?|\?\?)\s*"[^"]*[A-Za-z]'
            - has:
                kind: switch_entry
                regex: ':\s*"[^"]*[A-Za-z]'
                stopBy: end
    - all:
        - kind: function_declaration
        - has:
            field: name
            regex: "^(?:navigationTitle|title|subtitle|label|message|detail|placeholder|(?:status|error|validation|[A-Za-z0-9_]*(?:Status|Error|Validation))Message|[A-Za-z0-9_]*(?:Title|Subtitle|Label|Detail))$"
        - any:
            - has:
                kind: control_transfer_statement
                regex: '^return\s*"[^"]*[A-Za-z]'
                stopBy: end
            - has:
                kind: switch_entry
                regex: ':\s*"[^"]*[A-Za-z]'
                stopBy: end
            - regex: '\{\s*"[^"]*[A-Za-z]'
