id: cs-no-hardcoded-presentation-state
language: CSharp
severity: error
message: 'Presentation state must carry UiText/UiMessageKey so visible view models can refresh when LocaleChanged fires.'
files:
  - 'dotnet-clients/src/Voucha.Client.Core/**/*.cs'
ignores:
  - 'dotnet-clients/src/Voucha.Client.Core/Api/**/*.cs'
  - 'dotnet-clients/src/Voucha.Client.Core/Localization/**/*.cs'
rule:
  any:
    - all:
        - kind: string_literal
        - regex: '[A-Za-z][ A-Za-z]+'
        - inside:
            kind: property_declaration
            regex: '(?:Title|Label|Detail|Description|Message|Status|Placeholder)\s*=>'
            stopBy: end
        - not:
            inside:
              kind: tuple_expression
              stopBy: end
    - all:
        - kind: object_creation_expression
        - regex: '^new Omnisearch(ResultGroup|ResultRow)\s*\(\s*"[A-Za-z]'
    - all:
        - kind: assignment_expression
        - regex: '^(?:ErrorMessage|SuccessMessage|StatusMessage|EmptyStateMessage|Title|Subtitle|Detail|Description|Label|Placeholder)\s*=\s*"[A-Za-z]'
    - all:
        - kind: object_creation_expression
        - regex: '^new CommunitySummaryRow\s*\(\s*[^,]+,\s*"[A-Za-z]'
    - all:
        - kind: object_creation_expression
        - regex: '^new CommunitySummaryRow\s*\(\s*[^,]+,\s*[^,]+,\s*"[A-Za-z]'
    - all:
        - kind: object_creation_expression
        - regex: '^new ChatProviderStatus\s*\(\s*[^,]+,\s*"[A-Za-z]'
    - all:
        - kind: object_creation_expression
        - regex: '^new ChatProviderStatus\s*\(\s*[^,]+,\s*[^,]+,\s*[^,]+,\s*"[A-Za-z]'
    - all:
        - kind: invocation_expression
        - regex: '^Summary\s*\(\s*[^,]+,\s*"[A-Za-z]'
    - all:
        - kind: invocation_expression
        - regex: '^Summary\s*\(\s*[^,]+,\s*[^,]+,\s*"[A-Za-z]'
    - all:
        - kind: string_literal
        - regex: '"[^"]*[A-Za-z][^"]*[ ]+[^"]*"'
        - inside:
            kind: object_creation_expression
            regex: '^new (?:SettingsSelectionRowViewModel|SettingsToggleRowViewModel|MembershipPlanDefinition|MembershipPlanOptionViewModel|MembershipPlanPriceOptionViewModel|PostComposeValidation|CommunityActionValidation|ProfileHistoryTabRow|ReferralLinkRow|DirectMessageRow|DirectMessageParticipantRow|CommunitySummaryRow|GrowthRangeOption)\s*\('
            stopBy: end
    - all:
        - kind: return_statement
        - regex: '^return\s+(?:[^;?]+\?\s*)?"[A-Za-z][^"]*[ ][^"]*"'
    - all:
        - kind: property_declaration
        - regex: '(?:public|internal|private|protected)\s+[^\n]+\s+[A-Za-z0-9_]*(?:Title|Label|Detail|Description|Message|Status|Placeholder|Metadata|Action|Text)[A-Za-z0-9_]*\s*=>[^;]*"[A-Za-z][^"]*[ ][^"]*"'
    - all:
        - kind: property_declaration
        - regex: '(?:public|internal|private|protected)\s+[^\n]+\s+[A-Za-z0-9_]*(?:Title|Label|Detail|Description|Message|Status|Placeholder|Metadata|Action|Text)[A-Za-z0-9_]*\s*=>[^;]*[$]"(?:[^"]*[A-Za-z][^{}"]*[{][^"]*"|[^"]*[}][^{}"]*[A-Za-z][^"]*")'
    - all:
        - kind: property_declaration
        - regex: '(?:Title|LocalizedTitle)\s*=>[^;]*Post\.PostType'
    - all:
        - kind: interpolated_string_expression
        - regex: '[A-Za-z][ A-Za-z]+'
        - inside:
            kind: assignment_expression
            regex: '^(?:ErrorMessage|SuccessMessage|StatusMessage|EmptyStateMessage|Title|Subtitle|Detail|Description|Label|Placeholder)\s*='
            stopBy: end
    - all:
        - kind: return_statement
        - regex: '^return\s+[$]"[^"]*[A-Za-z][^"]*"'
    - all:
        - kind: conditional_expression
        - regex: '\?\s*"[A-Za-z][^"]*"\s*:'
        - inside:
            kind: object_creation_expression
            regex: '^new (?:NotificationRow|CrmContactRow|ListSummaryRow|ListItemRow|TopicRow|PostRow)\s*\('
            stopBy: end
    - all:
        - kind: record_declaration
        - regex: 'record (?:CrmContactRow|ListSummaryRow|ListItemRow|TopicRow|PostRow|NotificationRow)\s*\([^)]*\bstring\??\s+(?:Status|Vertical|Visibility|ItemType|MediaType|TopicType|PostType|LinkType|Direction|Type)\b'
    - pattern:
        context: |
          class Example
          {
            public IReadOnlyList<string> $NAME => $EXPR;
          }
        selector: property_declaration
constraints:
  NAME:
    regex: '^(?:DisplayNameSource|ProfileLinkType|ApiKeyType)Options$'
