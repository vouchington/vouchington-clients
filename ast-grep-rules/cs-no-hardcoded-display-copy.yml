id: cs-no-hardcoded-display-copy
language: CSharp
severity: error
message: 'MAUI dialog presentation copy must use UiCopy with a generated UiMessageKey; literals are reserved for protocol/user data.'
files:
  - 'dotnet-clients/src/Voucha.Client.App/**/*.cs'
rule:
  any:
    - all:
        - kind: string_literal
        - regex: '[A-Za-z]'
        - inside:
            kind: invocation_expression
            regex: '(?:DisplayAlert|DisplayPrompt|DisplayActionSheet)Async\s*\('
            stopBy: end
        - not:
            inside:
              kind: tuple_expression
              stopBy: end
    - all:
        - kind: interpolated_string_expression
        - regex: '[A-Za-z]'
        - inside:
            kind: assignment_expression
            regex: '^(?:[A-Za-z_][A-Za-z0-9_]*\.)*(?:Title|Text|Placeholder|PickerTitle)\s*='
            stopBy: end
    - all:
        - kind: string_literal
        - regex: '"[^"]*[A-Za-z][^"]*[ ]+[^"]*"'
        - inside:
            kind: assignment_expression
            regex: '^(?:[A-Za-z_][A-Za-z0-9_]*\.)*(?:Title|Text|Placeholder|PickerTitle)\s*='
            stopBy: end
    - all:
        - kind: invocation_expression
        - regex: '\.(?:ToString|Replace)\s*\('
        - inside:
            kind: assignment_expression
            regex: '^(?:[A-Za-z_][A-Za-z0-9_]*\.)*(?:Title|Text|Placeholder|PickerTitle)\s*='
            stopBy: end
    - all:
        - kind: string_literal
        - regex: '"[^"]*[A-Za-z][^"]*[ ]+[^"]*"'
        - inside:
            kind: assignment_expression
            regex: '^ItemsSource\s*='
            stopBy: end
        - not:
            inside:
              kind: tuple_expression
              stopBy: end
    - all:
        - kind: string_literal
        - regex: '"[a-z0-9]+_[a-z0-9_]+"'
        - inside:
            kind: assignment_expression
            regex: '^ItemsSource\s*='
            stopBy: end
    - all:
        - kind: assignment_expression
        - regex: '^(?:Title|Text|Placeholder|PickerTitle)\s*=\s*"[A-Za-z]'
    - all:
        - kind: string_literal
        - regex: '"[^"]*[A-Za-z][^"]*[ ]+[^"]*"'
        - inside:
            kind: assignment_expression
            regex: '^(?:[A-Za-z_][A-Za-z0-9_]*\.)*(?:Title|Text|Placeholder|PickerTitle|AutomationId)\s*='
            stopBy: end
    - all:
        - kind: string_literal
        - regex: '"[^"]*[A-Za-z][^"]*"'
        - inside:
            kind: invocation_expression
            regex: '(?:SemanticProperties\.SetDescription|SemanticProperties\.SetHint|AutomationProperties\.SetName|AutomationProperties\.SetHelpText)\s*\('
            stopBy: end
        - not:
            inside:
              kind: tuple_expression
              stopBy: end
    - all:
        - kind: interpolated_string_expression
        - regex: '[A-Za-z]'
        - inside:
            kind: invocation_expression
            regex: '(?:SemanticProperties\.SetDescription|SemanticProperties\.SetHint|AutomationProperties\.SetName|AutomationProperties\.SetHelpText)\s*\('
            stopBy: end
    - all:
        - kind: string_literal
        - regex: '"[^"]*[A-Za-z][^"]*[ ]+[^"]*"'
        - inside:
            kind: object_creation_expression
            regex: '^new (?:CommunitySummaryRow|ListItemOption|MenuItem|ToolbarItem)\s*\('
            stopBy: end
examples:
  - code: |
      await DisplayPromptAsync("Report", "Reason", accept: "Continue", cancel: "Cancel");
    isValid: false
    file: 'dotnet-clients/src/Voucha.Client.App/Pages/PostDetailPage.Actions.cs'
  - code: |
      await DisplayPromptAsync(
          UiCopy.Localize(UiMessageKey.NativeDotnetDialogsReport),
          UiCopy.Localize(UiMessageKey.NativeDotnetDialogsReason));
    isValid: true
    file: 'dotnet-clients/src/Voucha.Client.App/Pages/PostDetailPage.Actions.cs'
  - code: |
      await DisplayAlertAsync(
          UiCopy.Localize(UiMessageKey.NativeDotnetDialogsRunBackfill),
          UiCopy.Format(
              UiMessageKey.NativeDotnetDialogsRunBackfillDescription,
              ("description", UiText.Verbatim(backfill.Description))),
          UiCopy.Localize(UiMessageKey.NativeDotnetCommonOk));
    isValid: true
    file: 'dotnet-clients/src/Voucha.Client.App/Pages/EngineeringQueuesPage.xaml.cs'
  - code: |
      await DisplayAlertAsync(
          UiCopy.Localize(UiMessageKey.NativeDotnetDialogsRunBackfill),
          "Run this backfill now?",
          UiCopy.Localize(UiMessageKey.NativeDotnetCommonOk));
    isValid: false
    file: 'dotnet-clients/src/Voucha.Client.App/Pages/EngineeringQueuesPage.xaml.cs'
  - code: |
      var protocolReason = "illegal_content";
    isValid: true
    file: 'dotnet-clients/src/Voucha.Client.App/Pages/ProfilePage.Reporting.cs'
  - code: |
      Title = "Community settings";
    isValid: false
